<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>가계부</title>

<!-- ===== PWA / 홈 화면에 추가 (iOS Safari) ===== -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="가계부">
<meta name="theme-color" content="#F4F5F7">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='42' fill='%230FB9A5'/%3E%3Ctext x='90' y='122' font-size='96' font-family='-apple-system,sans-serif' font-weight='700' text-anchor='middle' fill='white'%3E%E2%82%A9%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='42' fill='%230FB9A5'/%3E%3Ctext x='90' y='122' font-size='96' font-family='-apple-system,sans-serif' font-weight='700' text-anchor='middle' fill='white'%3E%E2%82%A9%3C/text%3E%3C/svg%3E">

<style>
:root{
  --bg:#F4F5F7; --card:#FFFFFF; --ink:#1A1D21; --sub:#8B929C; --line:#EDEFF2;

  /* ── 색상 테마 ─────────────────────────────────────────────
     설정 → 색상 테마에서 고른 색을 JS가 이 변수들에 덮어써요.
     --accent(메인) / --income-color(수입) / --bank-color(통장 지출) / --card-color(신용카드)   */
  --accent:#0FB9A5; --accent-l:#28C4B0; --accent-d:#0C9887;
  --accent-soft:#E7F7F4; --accent-ink:#0A8A7A; --accent-on:#FFFFFF;
  --accent-ring:rgba(15,185,165,.5); --accent-shadow:rgba(12,152,135,.28); --accent-line:rgba(255,255,255,.22);
  --income-color:#2E8BF0; --income-d:#2570C0; --income-soft:#EAF2FE; --income-ink:#2E8BF0;
  --bank-color:#F2545B; --bank-d:#C24349; --bank-soft:#FDEDEE; --bank-ink:#F2545B;
  --card-color:#7B3FE4; --card-d:#6232B6; --card-soft:#F0EDFF; --card-ink:#7B3FE4;

  /* 예전 변수 이름 — 기존 규칙이 그대로 테마를 따라가도록 이어 둠 */
  --mint:var(--accent); --mint-d:var(--accent-d); --mint-soft:var(--accent-soft);
  --ex:var(--bank-ink); --ex-soft:var(--bank-soft);
  --inc:var(--income-ink); --inc-soft:var(--income-soft);
  --violet:var(--card-ink);
  --r:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
html,body{margin:0;padding:0;height:100%;max-width:100%;overflow-x:hidden;touch-action:manipulation;overscroll-behavior:none;-webkit-text-size-adjust:100%;text-size-adjust:100%}
html.modal-open,body.modal-open{overflow:hidden;overscroll-behavior:none}
body{
  background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font-family:inherit;font-size:16px;color:inherit}
#phone{
  position:relative;width:100%;max-width:430px;margin:0 auto;height:100dvh;
  background:var(--bg);display:flex;flex-direction:column;overflow:hidden;
  box-shadow:0 0 60px rgba(20,30,40,.12);
}
#scr{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:18px;overscroll-behavior:contain}
.hidden{display:none!important}

/* ---------- 공통 ---------- */
.vhead{
  position:sticky;top:0;z-index:30;background:var(--bg);box-shadow:none;
  padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 8px;
  display:flex;align-items:center;justify-content:space-between;gap:8px;
}
.vhead .ttl{font-size:19px;font-weight:800;letter-spacing:-.4px}
.mnav{display:flex;align-items:center;gap:2px;flex:0 0 auto}
.mnav button{width:30px;height:30px;border:0;background:transparent;border-radius:9px;display:grid;place-items:center;color:#6C747E}
.mnav .ym{font-size:16.5px;font-weight:800;letter-spacing:-.3px;min-width:104px;text-align:center}
.ghost{border:1px solid var(--line);background:#fff;color:#5C646E;font-size:11.5px;font-weight:700;padding:6px 9px;border-radius:10px}
.wrap{padding:0 14px}
.card{background:var(--card);border-radius:var(--r);padding:14px;margin:10px 0}
.sect-h{display:flex;align-items:baseline;justify-content:space-between;margin:13px 4px 6px}
.sect-h b{font-size:13.5px;font-weight:800;letter-spacing:-.2px}
.sect-h .l{font-size:11px;color:var(--sub);font-weight:600}
.muted{color:var(--sub);font-weight:600;font-size:11px}
.ex{color:var(--ex)}.inc{color:var(--inc)}.vio{color:var(--violet)}

/* ---------- 잔액 카드 ---------- */
.bal{
  border-radius:20px;padding:15px 16px 13px;color:var(--accent-on);
  background:linear-gradient(135deg,var(--accent-l) 0%,var(--accent-d) 100%);
  /* 위쪽(헤더 쪽)으로는 절대 번지지 않게 — 음수 spread 로 그림자 시작선을 카드 안쪽 아래로 내림 */
  box-shadow:0 12px 20px -8px var(--accent-shadow);
}
.wrap>.bal{margin-top:2px}
.bal .t{font-size:11.5px;font-weight:700;opacity:.85;letter-spacing:-.1px}
.bal .v{font-size:27px;font-weight:800;letter-spacing:-1px;margin:2px 0 10px;line-height:1.15}
.bal .v small{font-size:15px;font-weight:700;margin-left:2px;opacity:.9}
.bal .bsub{font-size:10.5px;font-weight:700;opacity:.8;letter-spacing:-.1px;margin:-6px 0 9px}
.bal .r{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;border-top:1px solid var(--accent-line);padding-top:9px}
.bal .r>div{display:flex;flex-direction:column;gap:2px}
.bal .r span{font-size:10.5px;opacity:.8;font-weight:600}
.bal .r b{font-size:12.5px;font-weight:800;letter-spacing:-.2px}

/* ---------- 카드 사용액 ---------- */
.cardstrip{display:flex;gap:7px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.cardstrip::-webkit-scrollbar{display:none}
.ctile{flex:1 0 0;min-width:100px;background:#fff;border-radius:14px;padding:10px 11px 9px}
.ct-top{display:flex;align-items:center;gap:5px;font-size:10.5px;color:#6C747E;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ct-top i{width:7px;height:7px;border-radius:50%;flex:0 0 auto}
.ct-amt{font-size:14px;font-weight:800;letter-spacing:-.4px;margin-top:4px}
.ct-amt.vio{color:var(--violet)}
.ct-bar{height:3px;border-radius:3px;background:#F0F2F5;margin-top:7px;overflow:hidden}
.ct-bar i{display:block;height:100%;border-radius:3px}
.ctile.empty{display:flex;align-items:center;justify-content:center;color:#A3AAB3;font-size:11.5px;font-weight:700;text-align:center}

/* ---------- 달력 ---------- */
.cal{background:#fff;border-radius:var(--r);padding:8px 8px 6px}
.wd{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:2px}
.wd span{text-align:center;font-size:10.5px;font-weight:700;color:#9AA1AA;padding:3px 0}
.wd span:first-child{color:#E8656E}.wd span:last-child{color:#4C8DF0}
.calleg{display:flex;justify-content:flex-end;align-items:center;gap:9px;padding:1px 3px 2px;font-size:9.5px;font-weight:700;color:#9AA1AA;letter-spacing:-.2px}
.calleg span{display:inline-flex;align-items:center;gap:3px}
.calleg i{width:5px;height:5px;border-radius:50%;display:block}
.calleg i.i{background:var(--income-color)}.calleg i.c{background:var(--bank-color)}.calleg i.v{background:var(--card-color)}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px}
.cell{
  height:60px;border:0;background:transparent;border-radius:11px;padding:3px 0 2px;
  display:flex;flex-direction:column;align-items:center;gap:0;cursor:pointer;overflow:hidden;
}
.cell .dn{font-size:11.5px;font-weight:700;color:#3A4048;width:19px;height:19px;line-height:19px;text-align:center;border-radius:50%;font-style:normal;margin-bottom:1px;flex:0 0 auto}
.cell.sun .dn{color:#E8656E}.cell.sat .dn{color:#4C8DF0}
.cell.today .dn{background:var(--accent);color:var(--accent-on)}
.cell.sel{background:var(--accent-soft);box-shadow:inset 0 0 0 1.5px var(--accent-ring)}

/* ---------- 선택 날짜 내역 ---------- */
.selday{background:#fff;border-radius:18px;margin:10px 0 0;overflow:hidden}
.sd-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 14px 0}
.sd-date{font-size:13.5px;font-weight:800;letter-spacing:-.3px;flex:0 0 auto}
.sd-date .dow{font-size:10.5px;color:#9AA1AA;font-weight:700}
.sd-tot{display:inline-flex;align-items:baseline;gap:8px;margin-left:auto;min-width:0;overflow:hidden;font-size:10px;font-weight:800;color:#9AA1AA;letter-spacing:-.2px;white-space:nowrap}
.sd-tot span{display:inline-flex;align-items:baseline;gap:3px;flex:0 0 auto}
.sd-tot b{font-size:12.5px;font-weight:800;letter-spacing:-.4px;font-variant-numeric:tabular-nums}
.sd-tot .in b{color:var(--inc)}
.sd-tot .out b{color:var(--ex)}
.sd-add{border:0;background:#F2F4F6;color:#5C646E;border-radius:9px;font-size:11px;font-weight:800;padding:6px 9px;flex:0 0 auto}
.sd-sum{display:flex;flex-wrap:wrap;gap:2px 10px;padding:7px 14px 11px;font-size:10.5px;font-weight:700;color:#8B929C;letter-spacing:-.2px}
.sd-sum span{display:inline-flex;align-items:center;white-space:nowrap}
.sd-sum i{width:5px;height:5px;border-radius:50%;display:block;margin-right:4px}
.sd-sum i.d-in{background:var(--income-color)}.sd-sum i.d-out{background:var(--bank-color)}.sd-sum i.d-card{background:var(--card-color)}
.sd-sum b{font-size:11.5px;font-weight:800;color:#3A4048;margin-left:3px;font-variant-numeric:tabular-nums}
.sd-sum b.inc{color:var(--income-ink)}.sd-sum b.ex{color:var(--bank-ink)}.sd-sum b.vio{color:var(--card-ink)}
.selday .items{border-radius:0;border-top:1px solid #F5F6F8}
.sd-empty{text-align:center;color:var(--sub);font-size:11.5px;font-weight:600;padding:18px 10px;border-top:1px solid #F5F6F8}
.cell .am{
  font-size:9.5px;line-height:11px;font-weight:700;letter-spacing:-.4px;font-style:normal;
  font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;
  max-width:100%;white-space:nowrap;padding:0 1px;
}
.cell .am.long{font-size:8.8px;letter-spacing:-.5px}
.cell .am.i{color:var(--inc)}
.cell .am.c{color:var(--ex)}
.cell .am.v{color:var(--card-ink)}
.cell.out{opacity:.32}
.cell .fx{font-size:8px;color:var(--violet);line-height:8px}

/* ---------- 예산 ---------- */
.bmini{background:#fff;border-radius:var(--r);padding:13px 14px;margin:10px 0}
.bmini .top{display:flex;justify-content:space-between;align-items:center}
.bmini .nm{font-size:12.5px;font-weight:800;letter-spacing:-.2px}
.bmini .pr{font-size:11px;color:var(--sub);font-weight:600}
.bar{height:8px;border-radius:6px;background:#EEF1F4;overflow:hidden;margin:9px 0 7px}
.bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent-l),var(--accent-d));transition:width .3s}
.bar i.warn{background:linear-gradient(90deg,#FFB020,#F5893A)}
.bar i.over{background:linear-gradient(90deg,var(--bank-color),var(--bank-d))}
.bmini .bot{display:flex;justify-content:space-between;font-size:11.5px;font-weight:700}
.bmini .bot .k{color:var(--sub);font-weight:600;margin-right:4px}

/* ---------- 예산 탭 ---------- */
.bbig{border-radius:20px;padding:16px;background:#fff;box-shadow:0 4px 14px rgba(25,35,45,.05)}
.bbig .lbl{font-size:12px;font-weight:800;color:var(--accent-ink);letter-spacing:-.2px}
.bbig .per{font-size:11.5px;color:var(--sub);font-weight:600;margin-top:2px}
.bbig .rem{font-size:28px;font-weight:800;letter-spacing:-1px;margin:10px 0 2px}
.bbig .rem small{font-size:14px;font-weight:700;margin-left:2px}
.bbig .sub2{font-size:11.5px;color:var(--sub);font-weight:600}
.bbig .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.kbox{background:#F7F8FA;border-radius:12px;padding:9px 10px}
.kbox .k{font-size:10.5px;color:var(--sub);font-weight:700;margin-bottom:3px}
.kbox .v{font-size:14px;font-weight:800;letter-spacing:-.4px}
.kbox .v.inc{color:var(--inc)}.kbox .v.ex{color:var(--ex)}.kbox .v.vio{color:var(--violet)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:12px 14px 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:#fff;color:#666E78;font-size:11.5px;font-weight:700;padding:7px 11px;border-radius:999px}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-on)}
.daily{background:var(--mint-soft);border-radius:14px;padding:11px 13px;display:flex;justify-content:space-between;align-items:center;margin-top:10px}
.daily .k{font-size:11.5px;font-weight:700;color:var(--accent-ink)}
.daily b{font-size:17px;font-weight:800;letter-spacing:-.4px;color:var(--accent-ink)}

/* ---------- 내역 목록 ---------- */
.daygroup{margin:12px 0 0}
.daygroup .dh{display:flex;justify-content:space-between;align-items:center;padding:0 6px 6px;font-size:11.5px;color:var(--sub);font-weight:700;gap:8px}
.daygroup .dh > span:last-child{display:inline-flex;align-items:baseline;gap:7px;flex:0 0 auto;white-space:nowrap;font-variant-numeric:tabular-nums}
.daygroup .dh b{color:#3A4048;font-size:12.5px;font-weight:800;margin-right:5px}
.items{background:#fff;border-radius:16px;overflow:hidden}
.item{display:flex;align-items:center;gap:10px;padding:11px 12px;border-bottom:1px solid #F5F6F8;width:100%;border:0;background:#fff;text-align:left;cursor:pointer}
.item:last-child{border-bottom:0}
.item .ic{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font-size:15px;flex:0 0 auto;background:#F4F6F8}
.item .mid{flex:1;min-width:0;display:block}
.item .nm{display:block;font-size:13px;font-weight:700;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .meta{display:block;font-size:10.5px;color:var(--sub);font-weight:600;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .amt{font-size:13.5px;font-weight:800;letter-spacing:-.4px;text-align:right;flex:0 0 auto}
.item .amt.inc{color:var(--inc)}
.item .amt.ex{color:var(--ex)}
.item .amt.vio{color:var(--card-ink)}
.tag{display:inline-block;font-size:9.5px;font-weight:800;padding:1px 5px;border-radius:5px;margin-left:4px;vertical-align:1px}
.tag.inst{background:var(--card-soft);color:var(--card-ink)}
.tag.fix{background:var(--accent-soft);color:var(--accent-ink)}
.empty{text-align:center;color:var(--sub);font-size:12.5px;font-weight:600;padding:34px 10px}

/* ---------- 통계 ---------- */
.stsum{background:#fff;border-radius:20px;padding:15px 16px 13px;box-shadow:0 4px 14px rgba(25,35,45,.05)}
.stsum .lbl{font-size:11.5px;font-weight:800;color:var(--sub);letter-spacing:-.2px}
.stsum .big{font-size:27px;font-weight:800;letter-spacing:-1px;margin:3px 0 11px;line-height:1.15;font-variant-numeric:tabular-nums}
.stsum .big small{font-size:14px;font-weight:700;margin-left:2px;color:#9AA1AA}
.stsum .r3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;border-top:1px solid var(--line);padding-top:10px}
.stsum .r3>div{display:flex;flex-direction:column;gap:2px;min-width:0}
.stsum .r3 span{font-size:10px;color:var(--sub);font-weight:700}
.stsum .r3 b{font-size:12.5px;font-weight:800;letter-spacing:-.3px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.donutcard{display:flex;align-items:center;gap:10px;background:#fff;border-radius:18px;padding:13px 12px;margin:10px 0}
.donutwrap{position:relative;flex:0 0 128px;width:128px;height:128px}
.donutwrap svg{width:128px;height:128px;display:block;transform:rotate(-90deg)}
.donutwrap .ctr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;pointer-events:none}
.donutwrap .ctr .k{font-size:9.5px;font-weight:700;color:var(--sub)}
.donutwrap .ctr b{font-size:13.5px;font-weight:800;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.dleg{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px}
.dleg .lg{display:flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;color:#3A4048;min-width:0}
.dleg .lg i{width:7px;height:7px;border-radius:2px;flex:0 0 auto}
.dleg .lg span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dleg .lg em{font-style:normal;color:var(--sub);font-weight:700;font-size:9.5px;flex:0 0 auto;font-variant-numeric:tabular-nums}
.stcard{background:#fff;border-radius:18px;overflow:hidden}
.strow{width:100%;border:0;background:#fff;text-align:left;display:flex;gap:10px;align-items:flex-start;padding:12px 13px;border-bottom:1px solid #F5F6F8;color:inherit;cursor:pointer}
.strow:last-of-type{border-bottom:0}
.strow.open{background:#FAFBFC}
.strow .ic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-size:16px;flex:0 0 auto;background:#F4F6F8}
.strow .mid{flex:1;min-width:0}
.strow .l1{display:flex;align-items:baseline;gap:6px}
.strow .nm{font-size:13px;font-weight:800;letter-spacing:-.2px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.strow .amt{font-size:13px;font-weight:800;letter-spacing:-.4px;flex:0 0 auto;font-variant-numeric:tabular-nums}
.strow .pc{font-size:10px;font-weight:800;color:#5C646E;background:#F2F4F6;border-radius:6px;padding:1.5px 5px;flex:0 0 auto;font-variant-numeric:tabular-nums}
.strow .sbar{display:block;height:5px;border-radius:4px;background:#F1F3F6;margin-top:7px;overflow:hidden}
.strow .sbar i{display:block;height:100%;border-radius:4px}
.strow .cnt{display:block;font-size:10px;color:var(--sub);font-weight:700;margin-top:5px}
.std{background:#FBFCFD;border-bottom:1px solid #F5F6F8}
.std .item{background:#FBFCFD;padding-left:14px}
.std .item:last-child{border-bottom:0}
.std .item .ic{width:28px;height:28px;border-radius:9px;font-size:13.5px}
.st-note{display:flex;align-items:center;justify-content:center;gap:5px;font-size:10px;color:#A3AAB3;font-weight:700;padding:9px 4px 2px}

/* ---------- 탭바 ---------- */
#tabs{
  display:flex;align-items:flex-end;justify-content:space-around;
  height:calc(62px + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);
  background:#FFFFFF;border-top:1px solid var(--line);
  position:relative;z-index:30;
}
#tabs button{flex:1;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 8px;color:#A3AAB3;font-size:10px;font-weight:700;letter-spacing:-.2px}
#tabs button.on{color:var(--accent-ink)}
#tabs #fab:active{transform:scale(.94)}
#tabs button svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
#fabwrap{flex:0 0 66px;display:flex;justify-content:center}
#tabs #fab{width:50px;height:50px;border-radius:50%;background:linear-gradient(135deg,var(--accent-l),var(--accent-d));color:var(--accent-on);font-size:26px;font-weight:400;display:grid;place-items:center;box-shadow:0 6px 16px var(--accent-shadow);margin-bottom:11px;position:relative;top:0;padding:0;border:0;flex:0 0 50px}

/* ---------- 모달 ---------- */
.modal{position:fixed;inset:0;z-index:100;display:flex;overscroll-behavior:contain}
.modal .bg{position:absolute;inset:0;background:rgba(16,22,28,.42);animation:fade .18s ease;touch-action:none}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{
  position:relative;margin-top:auto;width:100%;max-width:430px;max-height:88dvh;background:#fff;
  border-radius:22px 22px 0 0;display:flex;flex-direction:column;overflow:hidden;overscroll-behavior:contain;
  animation:up .24s cubic-bezier(.2,.9,.3,1);margin-left:auto;margin-right:auto;
}
@keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
.dialog{
  position:relative;margin:auto;width:calc(100% - 44px);max-width:360px;background:#fff;border-radius:20px;
  padding:18px;animation:zoom .18s ease;
}
@keyframes zoom{from{transform:scale(.94);opacity:.6}to{transform:scale(1);opacity:1}}
.sh-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px;border-bottom:1px solid var(--line);flex:0 0 auto}
.sh-head .ttl{font-size:15.5px;font-weight:800;letter-spacing:-.4px}
.sh-body{overflow-y:auto;padding:14px 16px 8px;flex:1;overscroll-behavior:contain;touch-action:pan-y;-webkit-overflow-scrolling:touch}
.sh-foot{flex:0 0 auto;padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:#fff}
.xbtn{width:28px;height:28px;border-radius:50%;border:0;background:#F2F4F6;color:#6C747E;font-size:15px;display:grid;place-items:center}
.pill{display:flex;background:#F2F4F6;border-radius:12px;padding:3px;gap:3px}
.pill button{flex:1;border:0;background:transparent;border-radius:9px;padding:8px 0;font-size:12.5px;font-weight:800;color:#7C848E}
.pill button.on{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(20,30,40,.1)}
.pill button.on.e{color:var(--ex)}.pill button.on.i{color:var(--inc)}

.amountbox{display:flex;align-items:baseline;justify-content:flex-end;gap:4px;padding:2px 2px 9px;border-bottom:2px solid var(--ink)}
.amountbox input{border:0;outline:0;text-align:right;font-size:28px;font-weight:800;letter-spacing:-1.2px;width:100%;background:transparent;min-width:0}
.amountbox.inc input{color:var(--inc)}
.amountbox.ex input{color:var(--ex)}
.amountbox.vio input{color:var(--violet)}
.amountbox input::placeholder{color:#D3D8DE}
.amountbox span{font-size:15px;font-weight:700;color:#9AA1AA}

/* ---------- 금액 계산기 ---------- */
.calcbtn{
  flex:0 0 auto;align-self:center;width:32px;height:32px;border-radius:10px;border:0;background:#F2F4F6;color:#6C747E;
  display:grid;place-items:center;padding:0;-webkit-tap-highlight-color:transparent;
}
.calcbtn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.calcbtn.on{background:var(--accent-soft);color:var(--accent-ink);box-shadow:inset 0 0 0 1px var(--accent-ring)}
.calcpanel{margin-top:9px;background:#F7F8FA;border-radius:14px;padding:9px 9px 8px;animation:calcIn .16s ease}
@keyframes calcIn{from{opacity:.4;transform:translateY(-4px)}to{opacity:1;transform:none}}
.calcline{padding:1px 4px 7px;min-height:32px;display:flex;flex-direction:column;gap:1px}
.calcline .exp{font-size:12.5px;font-weight:700;color:#7C848E;text-align:right;min-height:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.calcline .eq{font-size:15.5px;font-weight:800;letter-spacing:-.4px;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.calcline .eq.bad{color:var(--ex);font-size:12px;letter-spacing:0}
.calcgrid{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:36px;gap:5px}
.calcgrid button{
  border:0;border-radius:11px;background:#fff;color:#2C333B;font-size:16px;font-weight:800;
  display:grid;place-items:center;padding:0;box-shadow:0 1px 2px rgba(20,30,40,.05);-webkit-tap-highlight-color:transparent;
}
.calcgrid button:active{transform:scale(.96);background:#EEF1F4}
.calcgrid button.op{color:var(--accent-ink);background:var(--accent-soft);font-size:17px}
.calcgrid button.fn{color:#6C747E;background:#EFF2F5;font-size:13px}
.calcgrid button.eq{grid-row:span 2;background:var(--accent);color:var(--accent-on);font-size:18px;box-shadow:0 2px 6px var(--accent-shadow)}
.calcgrid button.eq:active{background:var(--accent-d)}
.field{margin-top:11px}
.field .lb{font-size:11.5px;font-weight:800;color:#6C747E;margin-bottom:6px;letter-spacing:-.2px}
.line{display:flex;align-items:center;justify-content:space-between;gap:8px;background:#F7F8FA;border-radius:12px;padding:11px 12px}
.line input[type=date],.line input[type=text],.line input[type=number],.line select{
  border:0;background:transparent;outline:0;font-size:16px;font-weight:700;width:100%;-webkit-appearance:none;appearance:none
}
.line input{outline:0;border:0;background:transparent;font-size:16px;font-weight:700}
.line input:focus{outline:0}
.dateline{position:relative;cursor:pointer}
.dateline .dlabel{font-size:13.5px;font-weight:700;flex:1}
.dateline .dateov{position:absolute;inset:0;width:100%;height:100%;opacity:0;border:0;padding:0;margin:0}
.dateline .calico{width:17px;height:17px;stroke:#8B929C;fill:none;stroke-width:1.7;pointer-events:none}
.line select{background:transparent}
.catgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.cat{border:1px solid var(--line);background:#fff;border-radius:13px;padding:7px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:700;color:#5C646E}
.cat span{font-size:17px;line-height:19px}
.cat.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink)}
.catsc{display:flex;gap:6px;overflow-x:auto;padding:1px 0 2px;scrollbar-width:none}
.catsc::-webkit-scrollbar{display:none}
.catsc .cat{flex:0 0 auto;flex-direction:row;gap:5px;padding:8px 11px;border-radius:999px;font-size:11.5px;white-space:nowrap}
.catsc .cat span{font-size:14px;line-height:16px}
.seg{display:flex;gap:6px}
.seg button{flex:1;border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 0;font-size:12px;font-weight:700;color:#6C747E}
.seg button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink)}
.cardchips{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.cpal{display:grid;grid-template-columns:repeat(8,1fr);gap:7px;margin-top:8px}
.cpal button{position:relative;height:32px;border:0;border-radius:10px;padding:0;background:var(--sw);box-shadow:inset 0 0 0 1px rgba(20,30,40,.10);-webkit-tap-highlight-color:transparent}
.cpal button:active{transform:scale(.94)}
.cpal button.on{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--ink)}
.cpal button.on::after{content:"✓";position:absolute;inset:0;display:grid;place-items:center;font-size:12px;font-weight:900;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.55)}
.cardchips button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 11px;font-size:11.5px;font-weight:700;color:#5C646E;display:flex;align-items:center;gap:5px}
.cardchips button i{width:7px;height:7px;border-radius:50%;display:block}
.cardchips button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink)}
.hint{font-size:10.5px;color:var(--sub);font-weight:600;margin-top:6px;line-height:1.45}
.btn{border:0;border-radius:14px;padding:14px 0;width:100%;font-size:14.5px;font-weight:800;background:var(--accent);color:var(--accent-on);letter-spacing:-.3px}
.btn:active{background:var(--accent-d)}
.btn.sec{background:#F2F4F6;color:#5C646E}
.btn.danger{background:var(--ex-soft);color:var(--ex)}
.btnrow{display:flex;gap:8px}

/* ---------- 설정 ---------- */
.slist{background:#fff;border-radius:16px;overflow:hidden;margin:8px 0 0}
.srow{display:flex;align-items:center;gap:10px;padding:13px 14px;border-bottom:1px solid #F5F6F8}
.srow:last-child{border-bottom:0}
.srow .txt{flex:1;min-width:0}
.srow .t1{font-size:13px;font-weight:700;letter-spacing:-.2px}
.srow .t2{font-size:10.5px;color:var(--sub);font-weight:600;margin-top:2px}
.srow .sic{width:30px;height:30px;border-radius:9px;background:#F4F6F8;display:grid;place-items:center;font-size:15px;line-height:1;flex:0 0 auto}
.act{border:0;background:#F4F6F8;color:#5C646E;font-size:11px;font-weight:800;border-radius:9px;padding:6px 9px;white-space:nowrap;flex:0 0 auto}
.act.d{color:var(--ex);background:var(--ex-soft)}
.catrow{display:flex;align-items:center;gap:8px;padding:9px 2px;border-bottom:1px solid #F5F6F8}
.catrow:last-child{border-bottom:0}
.catrow .ic{width:30px;height:30px;border-radius:9px;background:#F4F6F8;display:grid;place-items:center;font-size:15px;flex:0 0 auto}
.catrow .nm{flex:1;min-width:0;font-size:13px;font-weight:700;letter-spacing:-.2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.catrow .nmbtn{flex:1;min-width:0;display:flex;align-items:center;gap:8px;border:0;background:transparent;padding:0;text-align:left;color:inherit;-webkit-tap-highlight-color:transparent}
.catrow .nmbtn:active{opacity:.55}
.addbtn{width:100%;border:1px dashed #CBD2DA;background:#fff;color:#5C646E;border-radius:12px;padding:11px 0;font-size:12.5px;font-weight:800}

/* ---------- 색상 테마 (설정) ---------- */
.themecard{background:#fff;border-radius:18px;padding:0 12px;margin-top:2px;overflow:hidden}
.themerow{display:flex;align-items:center;gap:9px;width:100%;border:0;background:transparent;padding:14px 2px;text-align:left;-webkit-tap-highlight-color:transparent}
.themerow:active{opacity:.65}
.themerow b{font-size:13.5px;font-weight:800;letter-spacing:-.2px;flex:1;min-width:0;color:var(--ink)}
.themerow .tdots{display:inline-flex;align-items:center;gap:4px;flex:0 0 auto}
.tdot{width:11px;height:11px;border-radius:50%;display:block;box-shadow:inset 0 0 0 1px rgba(20,30,40,.14)}
.tchev{width:16px;height:16px;stroke:#8B929C;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto;transition:transform .24s ease}
.themecard.open .tchev{transform:rotate(180deg)}
.themebody{overflow:hidden;height:0;opacity:0;transition:height .26s cubic-bezier(.22,.61,.36,1),opacity .18s ease}
.themecard.open .themebody{opacity:1}
.themebody .tbody{padding-bottom:13px}
.tprev{background:#F7F8FA;border-radius:16px;padding:10px}
.tprev .bal{padding:12px 14px 11px;border-radius:16px}
.tprev .bal .t{font-size:10.5px}
.tprev .bal .v{font-size:21px;margin:1px 0 8px}
.tprev .bal .r{padding-top:7px}
.tprev .bal .r span{font-size:9.5px}
.tprev .bal .bsub{font-size:9.5px;margin:-4px 0 7px}
.tprev .bal .r b{font-size:11px}
.tprev-rows{margin-top:8px;background:#fff;border-radius:12px;overflow:hidden}
.tprev-row{display:flex;align-items:center;gap:8px;padding:7px 10px;border-bottom:1px solid #F5F6F8;font-size:12px;font-weight:700}
.tprev-row:last-child{border-bottom:0}
.tprev-row .ic{font-size:14px;line-height:1;flex:0 0 auto}
.tprev-row .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#3A4048}
.tprev-row .amt{font-size:12.5px;font-weight:800;letter-spacing:-.3px;font-variant-numeric:tabular-nums;flex:0 0 auto}
.tprev-row .amt.inc{color:var(--income-ink)}
.tprev-row .amt.ex{color:var(--bank-ink)}
.tprev-row .amt.vio{color:var(--card-ink)}
.tprev-acts{display:flex;align-items:center;gap:6px;margin-top:8px}
.tprev-acts .btn{flex:1;padding:9px 0;font-size:12.5px;border-radius:12px}
.tprev-acts .chip{font-size:10.5px;padding:6px 10px}
.tprev .bar{height:6px;margin:8px 0 0}
.tgroup{border-top:1px solid var(--line);margin-top:12px;padding-top:11px}
.tgroup:first-of-type{border-top:0;margin-top:6px;padding-top:2px}
.trow{display:flex;align-items:center;gap:8px}
.tcur{width:14px;height:14px;border-radius:50%;flex:0 0 auto;box-shadow:inset 0 0 0 1px rgba(20,30,40,.14)}
.ttx{flex:1;min-width:0}
.ttx b{display:block;font-size:12.5px;font-weight:800;letter-spacing:-.2px}
.ttx span{display:block;font-size:10.5px;color:var(--sub);font-weight:600;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thex{font-size:10px;font-weight:800;color:#8B929C;font-variant-numeric:tabular-nums;letter-spacing:.1px;flex:0 0 auto}
.tpal{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin-top:9px}
.tsw-chip{position:relative;height:30px;border:0;border-radius:9px;padding:0;background:var(--sw);box-shadow:inset 0 0 0 1px rgba(20,30,40,.10);-webkit-tap-highlight-color:transparent}
.tsw-chip:active{transform:scale(.94)}
.tsw-chip.on{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--ink)}
.tsw-chip.on::after{content:"✓";position:absolute;inset:0;display:grid;place-items:center;font-size:13px;font-weight:900;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.55)}
.tfoot{margin-top:9px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tcustom{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#F7F8FA;border-radius:10px;padding:6px 9px;font-size:11.5px;font-weight:800;color:#5C646E;cursor:pointer}
.tcustom input[type=color]{width:28px;height:22px;border:0;padding:0;background:transparent;-webkit-appearance:none;appearance:none;cursor:pointer}
.tcustom input[type=color]::-webkit-color-swatch-wrapper{padding:0}
.tcustom input[type=color]::-webkit-color-swatch{border:1px solid rgba(20,30,40,.16);border-radius:6px}
.thint{font-size:10.5px;color:var(--sub);font-weight:600;margin-top:7px;line-height:1.45}
.resetbtn{width:100%;margin-top:12px;border:1px solid var(--line);background:#F7F8FA;color:#5C646E;border-radius:12px;padding:11px 0;font-size:12.5px;font-weight:800}
.resetbtn:active{background:#EEF1F4}
.addbtn:active{background:#F7F8FA}
.catprev{display:flex;align-items:center;gap:11px;background:#F7F8FA;border-radius:14px;padding:11px 12px}
.catprev .ic{width:48px;height:48px;border-radius:14px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;font-size:25px;line-height:1;flex:0 0 auto}
.catprev .txt{flex:1;min-width:0}
.catprev .nm{font-size:14px;font-weight:800;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.catprev .sb{font-size:10.5px;color:var(--sub);font-weight:600;margin-top:2px}
.empick{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.empick button{height:42px;border:1px solid var(--line);background:#fff;border-radius:11px;padding:0;font-size:20px;line-height:1;display:grid;place-items:center;-webkit-tap-highlight-color:transparent}
.empick button:active{transform:scale(.94)}
.empick button.on{border-color:var(--mint);background:var(--mint-soft);box-shadow:inset 0 0 0 1px var(--mint)}
.mini{font-size:11px;color:var(--sub);font-weight:600;padding:2px 6px 0}
.switch{width:44px;height:26px;border-radius:99px;background:#DDE1E6;border:0;position:relative;transition:.18s;flex:0 0 auto}
.switch i{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.18s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch.on{background:var(--mint)}
.switch.on i{left:21px}
.addrow{display:flex;gap:7px;padding:10px 14px 13px}
.addrow input{flex:1;min-width:0;border:1px solid var(--line);border-radius:11px;padding:9px 11px;font-size:16px;font-weight:700;outline:0}
.addrow input:focus{border-color:var(--mint)}
.addrow button{border:0;background:var(--accent);color:var(--accent-on);border-radius:11px;padding:0 13px;font-size:12.5px;font-weight:800;flex:0 0 auto;white-space:nowrap}

/* ---------- 할부 관리 ---------- */
.irow{width:100%;display:flex;align-items:flex-start;gap:10px;padding:12px 14px;border:0;border-bottom:1px solid #F5F6F8;background:#fff;text-align:left;color:inherit;cursor:pointer}
.irow:last-child{border-bottom:0}
.irow:active{background:#FAFBFC}
.irow .iic{width:32px;height:32px;border-radius:10px;background:#F4F6F8;display:grid;place-items:center;font-size:15px;flex:0 0 auto}
.irow .imain{flex:1;min-width:0;display:block}
.irow .itop{display:flex;align-items:center;gap:5px}
.irow .inm{font-size:13px;font-weight:800;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.irow .iseq{font-size:9.5px;font-weight:800;color:var(--card-ink);background:var(--card-soft);border-radius:5px;padding:1px 5px;flex:0 0 auto}
.irow .itot{font-size:12.5px;font-weight:800;letter-spacing:-.3px;margin-left:auto;flex:0 0 auto;font-variant-numeric:tabular-nums;color:var(--violet)}
.irow .isub{display:block;font-size:10.5px;color:var(--sub);font-weight:600;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.irow .isub b{color:#3A4048;font-weight:800}
.irow .iprog{display:block;height:4px;border-radius:3px;background:#F0F2F5;margin-top:7px;overflow:hidden}
.irow .iprog i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--card-color),var(--card-d))}
.irow.done .iseq{background:#F2F4F6;color:#8B929C}
.irow.done .iprog i{background:#D8DDE3}
.irow.done .itot{color:var(--sub)}

/* ---------- 토스트 ---------- */
#toast{
  position:fixed;left:50%;bottom:96px;transform:translate(-50%,14px);z-index:200;
  background:rgba(26,29,33,.92);color:#fff;font-size:12.5px;font-weight:700;
  padding:10px 16px;border-radius:12px;opacity:0;pointer-events:none;transition:.22s;white-space:nowrap;
}
#toast.on{opacity:1;transform:translate(-50%,0)}
</style>

<body>
<div id="phone">
  <main id="scr"></main>
  <nav id="tabs">
    <button data-tab="calendar" onclick="App.goto('calendar')">
      <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>
      <span>달력</span>
    </button>
    <button data-tab="stats" onclick="App.goto('stats')">
      <svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9h-9V3z"/><path d="M14.6 2.7a9 9 0 0 1 6.7 6.7h-6.7V2.7z"/></svg>
      <span>통계</span>
    </button>
    <div id="fabwrap"><button id="fab" onclick="App.addForSelected()">+</button></div>
    <button data-tab="budget" onclick="App.goto('budget')">
      <svg viewBox="0 0 24 24"><path d="M4 19V9M10 19V5M16 19v-6M22 19H2"/></svg>
      <span>예산</span>
    </button>
    <button data-tab="settings" onclick="App.goto('settings')">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1A1.6 1.6 0 0 0 9 19.4a1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.6 1.6 0 0 0 4.6 9a1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/></svg>
      <span>설정</span>
    </button>
  </nav>
</div>
<div id="modal" class="modal hidden"></div>
<div id="toast"></div>

<script>
/* ============================================================
   CORE — 순수 계산 로직 (DOM 의존 없음, 자동 테스트 대상)
   ============================================================ */
/* ===== CORE:START ===== */
var CORE = (function () {

  function ymd(y, m, d) { return y + '-' + pad2(m) + '-' + pad2(d); }
  function parts(s) { var a = String(s).split('-').map(Number); return { y: a[0], m: a[1], d: a[2] }; }
  function ymOf(s) { return String(s).slice(0, 7); }
  function ymParts(ym) { var a = String(ym).split('-').map(Number); return { y: a[0], m: a[1] }; }
  function daysInMonth(y, m) { return new Date(y, m, 0).getDate(); } // m: 1~12
  function clampDay(y, m, day) {
    var dim = daysInMonth(y, m);
    var d = Math.floor(Number(day) || 1);
    if (d < 1) d = 1;
    if (d > dim) d = dim;
    return d;
  }
  function ymAdd(ym, n) {
    var p = ymParts(ym);
    var t = new Date(p.y, p.m - 1 + n, 1);
    return t.getFullYear() + '-' + pad2(t.getMonth() + 1);
  }
  function monthDiff(fromYm, toYm) {
    var a = ymParts(fromYm), b = ymParts(toYm);
    return (b.y - a.y) * 12 + (b.m - a.m);
  }
  function isYm(s) { return /^\d{4}-\d{2}$/.test(String(s)); }
  function cmpYm(a, b) { return a < b ? -1 : a > b ? 1 : 0; }
  function dayDiff(a, b) { // b - a (일)
    return Math.round((Date.parse(b + 'T00:00:00') - Date.parse(a + 'T00:00:00')) / 86400000);
  }
  function todayStr(d) {
    var t = d || new Date();
    return ymd(t.getFullYear(), t.getMonth() + 1, t.getDate());
  }

  /* ---- 할부: 원 단위 잔여분은 첫 회차에 몰아 반영 ---- */
  function normMonths(tx) {
    var n = tx && tx.installment && tx.installment.months ? Number(tx.installment.months) : 1;
    if (!isFinite(n) || n < 1) n = 1;
    if (n > 36) n = 36;
    return Math.floor(n);
  }
  function installmentParts(tx) {
    var n = normMonths(tx);
    var amount = Math.max(0, Math.round(Number(tx.amount) || 0));
    var base = Math.floor(amount / n);
    var rem = amount - base * n;
    var out = [];
    for (var i = 0; i < n; i++) out.push(base + (i === 0 ? rem : 0));
    return out;
  }
  // 특정 월(ym)에 이 거래가 반영되는 금액 (할부 회차 반영)
  function txAmountInMonth(tx, ym) {
    var n = normMonths(tx);
    var diff = monthDiff(ymOf(tx.date), ym);
    if (diff < 0) return 0;
    if (n === 1) return diff === 0 ? Math.round(Number(tx.amount) || 0) : 0;
    if (diff >= n) return 0;
    return installmentParts(tx)[diff];
  }

  /* ---- 할부 한 건의 진행 상황 (할부 관리 목록용) ---- */
  function installmentInfo(tx, ym) {
    var n = normMonths(tx);
    var start = ymOf(tx.date);
    var total = Math.max(0, Math.round(Number(tx.amount) || 0));
    var parts = installmentParts(tx);
    var cur = monthDiff(start, ym) + 1;   /* 1회차 = 결제월 */
    var paid = 0, remain = 0;
    for (var i = 0; i < n; i++) { if (i < cur - 1) paid += parts[i]; else remain += parts[i]; }
    return {
      months: n, start: start, end: ymAdd(start, n - 1),
      total: total, parts: parts, monthly: n > 1 ? parts[1] : parts[0],
      cur: cur, seq: Math.min(Math.max(cur, 0), n), paid: paid, remain: remain,
      done: cur > n, before: cur < 1
    };
  }

  /* ---- 정기 지출/수입 ---- */
  function subActiveIn(sub, ym) {
    if (sub.active === false) return false;
    var startYm = sub.startMonth ? String(sub.startMonth).slice(0, 7) : '0000-00';
    if (cmpYm(ym, startYm) < 0) return false;
    if (sub.endMonth && cmpYm(ym, String(sub.endMonth).slice(0, 7)) > 0) return false;
    return true;
  }
  function subDayIn(sub, y, m) {
    var dim = daysInMonth(y, m);
    if (sub.day === 'end' || sub.day === -1 || sub.day === 'last') return dim;
    return clampDay(y, m, Number(sub.day));
  }
  /* ---- 다음 달에 통장에서 빠져나갈 정기 지출 합계 ----
     달력 상단 잔액 카드에서 '미리 빼 둘 돈'으로 보여 주기 위한 값만 계산한다.
     통장 출금분(계좌·체크)만 넣고, 신용카드로 긁는 구독은 다음 달 대금으로 나가므로 빼지 않는다. */
  function subReserveNext(db, ym) {
    var nextYm = ymAdd(ym, 1), total = 0;
    ((db && db.subscriptions) || []).forEach(function (sub) {
      if (!sub) return;
      if ((sub.type || 'expense') !== 'expense') return;
      if ((sub.method || 'account') === 'credit') return;
      if (!subActiveIn(sub, nextYm)) return;
      total += Math.round(Number(sub.amount) || 0);
    });
    return total;
  }

  /* ---- 한 달(1일~말일) 항목 전개 ---- */
  function entriesForMonth(db, ym) {
    var p = ymParts(ym);
    var y = p.y, m = p.m, dim = daysInMonth(y, m);
    var out = [];

    (db.transactions || []).forEach(function (tx) {
      if (!tx || !tx.date) return;
      var amount = txAmountInMonth(tx, ym);
      if (!amount) return;
      var n = normMonths(tx);
      var d;
      if (n === 1 && ymOf(tx.date) === ym) {
        d = parts(tx.date).d;
      } else {
        /* 회차별 실제 결제일이 다르면 그 날짜를 그대로 쓴다(없으면 결제일 기준) */
        var seqIdx = monthDiff(ymOf(tx.date), ym);
        var dayList = (tx.installment && tx.installment.days) || null;
        var dayWant = dayList && dayList[seqIdx] ? Number(dayList[seqIdx]) : parts(tx.date).d;
        d = clampDay(y, m, dayWant);
      }
      out.push({
        date: ymd(y, m, d), type: tx.type || 'expense', amount: amount,
        catId: tx.catId || null, method: tx.method || 'account', cardId: tx.cardId || null, cardBill: tx.cardBill === true,
        memo: tx.memo || '', kind: n > 1 ? 'installment' : 'tx',
        txId: tx.id, seq: n > 1 ? monthDiff(ymOf(tx.date), ym) + 1 : 0, months: n,
        totalAmount: Math.round(Number(tx.amount) || 0)
      });
    });

    (db.subscriptions || []).forEach(function (sub) {
      if (!sub || !subActiveIn(sub, ym)) return;
      var amt = Math.round(Number(sub.amount) || 0);
      if (!amt) return;
      out.push({
        date: ymd(y, m, subDayIn(sub, y, m)), type: sub.type || 'expense', amount: amt,
        catId: sub.catId || null, method: sub.method || 'account', cardId: sub.cardId || null, cardBill: sub.cardBill === true,
        memo: sub.memo || '', kind: 'fixed', subId: sub.id, name: sub.name || '정기 지출',
        emoji: sub.emoji || '', seq: 0, months: 1
      });
    });

    out.sort(function (a, b) {
      if (a.date !== b.date) return a.date < b.date ? -1 : 1;
      if (a.type !== b.type) return a.type === 'income' ? -1 : 1;
      return b.amount - a.amount;
    });
    return out;
  }

  function sum(list) { return list.reduce(function (s, e) { return s + e.amount; }, 0); }

  function monthSummary(db, ym) {
    var all = entriesForMonth(db, ym);
    var inc = all.filter(function (e) { return e.type === 'income'; });
    var exp = all.filter(function (e) { return e.type === 'expense'; });
    var byMethod = { account: 0, debit: 0, credit: 0 };
    var byCard = {};
    (db.cards || []).forEach(function (c) { byCard[c.id] = 0; });
    exp.forEach(function (e) {
      if (byMethod[e.method] === undefined) byMethod[e.method] = 0;
      byMethod[e.method] += e.amount;
      if (e.method === 'credit') {
        var k = e.cardId || '__none__';
        byCard[k] = (byCard[k] || 0) + e.amount;
      }
    });
    var income = sum(inc), expense = sum(exp);
    /* 통계용 소비 집계: 카드대금·저축은 빼고 본다 (달력·통장 잔액은 exp 그대로) */
    var consumeEntries = [], consumeCash = 0, consumeCard = 0, exBill = 0, exSave = 0;
    exp.forEach(function (e) {
      var kind = excludeKind(db, e);
      if (kind === 'cardbill') { exBill += e.amount; return; }
      if (kind === 'saving') { exSave += e.amount; return; }
      consumeEntries.push(e);
      if (e.method === 'credit') consumeCard += e.amount; else consumeCash += e.amount;
    });
    /* 통장(현금) 흐름: 계좌이체 + 체크카드만 통장에서 바로 나간 돈. 신용카드는 다음 달 대금으로 따로 나감 */
    var cashOut = byMethod.account + byMethod.debit;
    var cardOut = byMethod.credit;
    return {
      ym: ym, entries: all, incomeEntries: inc, expenseEntries: exp,

      cashOut: cashOut, cardOut: cardOut, cashNet: income - cashOut,
      byMethod: byMethod, byCard: byCard,
      consume: {

        entries: consumeEntries

  }

  /* ---- 전월 잔액 이월 ---- */
  function startYmOf(db) {
    var st = (db && db.settings) || {};
    if (isYm(st.startMonth)) return st.startMonth;
    var cands = [];
    (db.transactions || []).forEach(function (t) { if (t.date) cands.push(ymOf(t.date)); });
    (db.subscriptions || []).forEach(function (s) { if (s.startMonth) cands.push(String(s.startMonth).slice(0, 7)); });
    (db.budgets || []).forEach(function (b) { if (b.start) cands.push(ymOf(b.start)); });
    cands.sort();
    return cands.length ? cands[0] : '2000-01';
  }

  function carryInFor(db, ym) {
    var st = db.settings || {};
    var base = Math.round(Number(st.startBalance) || 0);
    if (st.carryOver === false) return 0;
    var sy = startYmOf(db);
    var diff = monthDiff(sy, ym);
    if (diff < 0) return 0;
    if (diff === 0) return base;
    var bal = base, cur = sy, guard = 0;
    while (cmpYm(cur, ym) < 0 && guard++ < 600) {
      var s = monthSummary(db, cur);
      bal += s.cashNet;   /* 통장 잔액 기준으로 이월 */
      cur = ymAdd(cur, 1);
    }
    return bal;
  }

  function monthFull(db, ym) {
    var s = monthSummary(db, ym);
    var carryIn = carryInFor(db, ym);
    s.carryIn = carryIn;
    s.balance = carryIn + s.cashNet;       /* 통장 잔액 — 이월은 이 값 기준으로 넘어간다 */
    s.balanceAll = carryIn + s.net;        /* 참고: 카드 사용까지 포함한 잔액 */
    /* 화면 표시용 — 다음 달 정기 구독(통장 출금분)을 미리 뺀 '사용 가능 잔액'.
       이월 계산(carryInFor)·통장 잔액(balance)은 건드리지 않는다(이중 차감 방지). */
    s.nextSubReserve = subReserveNext(db, ym);
    s.subReserveOn = ((db && db.settings) || {}).subReserve !== false;
    s.usableBalance = s.balance - s.nextSubReserve;
    return s;
  }

  /* ---- 예산에서 빼는 지출 판별 ----
     '카드대금'과 '저축' 항목(또는 플래그)으로 적은 지출은 예산 사용액에서 빼고 계산한다.
     통계(총 지출·카테고리)·통장 잔액 계산에는 그대로 들어간다. */
  function normName(s) { return String(s == null ? '' : s).replace(/\s+/g, ''); }
  function catOf(db, catId) {
    var cats = (db && db.categories && db.categories.expense) || [];
    for (var i = 0; i < cats.length; i++) {
      if (cats[i] && cats[i].id === catId) return cats[i];
    }
    return null;
  }
  function catExcludeKind(c) {
    if (!c) return null;

    if (c.isSaving === true || c.budgetExclude === 'saving') return 'saving';
    var nm = normName(c.name);
    if (nm.indexOf('카드대금') >= 0) return 'cardbill';
    if (nm.indexOf('저축') >= 0 || nm.indexOf('적금') >= 0) return 'saving';
    return null;
  }

  function excludeKind(db, e) {
    if (!e || e.type !== 'expense') return null;
    if (e.cardBill === true || e.budgetExclude === 'cardbill') return 'cardbill';
    if (e.isSaving === true || e.budgetExclude === 'saving') return 'saving';
    return catExcludeKind(catOf(db, e.catId));

  function isCardBill(db, e) { return excludeKind(db, e) === 'cardbill'; }
  function isSaving(db, e) { return excludeKind(db, e) === 'saving'; }

  function isCardBillCat(db, catId) { return catExcludeKind(catOf(db, catId)) === 'cardbill'; }
  function isSavingCat(db, catId) { return catExcludeKind(catOf(db, catId)) === 'saving'; }

  /* ---- 예산 기간 계산 ----
     basis: 'cash' = 통장 지출(계좌·체크) / 'all' = 카드 사용까지 포함한 전체 소비
     두 기준 모두 카드대금·저축은 사용액에서 제외한다. */
  function sumExpenseInRange(db, start, end, basis) {
    var cashOnly = basis === 'cash';
    var total = 0, cash = 0, card = 0, bill = 0, save = 0;
    var list = [], bills = [], savings = [];
    var cur = ymOf(start), endYm = ymOf(end), guard = 0;
    while (cmpYm(cur, endYm) <= 0 && guard++ < 600) {
      entriesForMonth(db, cur).forEach(function (e) {
        if (e.type !== 'expense' || e.date < start || e.date > end) return;
        var kind = excludeKind(db, e);
        if (kind === 'cardbill') { bill += e.amount; bills.push(e); return; }   /* 카드대금은 예산에서 제외 */
        if (kind === 'saving') { save += e.amount; savings.push(e); return; }    /* 저축은 예산에서 제외 */
        var isCard = e.method === 'credit';
        if (isCard) card += e.amount; else cash += e.amount;
        if (cashOnly && isCard) return;
        total += e.amount;
        list.push(e);
      });
      cur = ymAdd(cur, 1);
    }
    return {
      total: total, cashTotal: cash, cardTotal: card,
      billTotal: bill, saveTotal: save, excludedTotal: bill + save,
      entries: list, cardBillEntries: bills, savingEntries: savings
    };
  }

  function budgetStats(db, budget, today, basis) {
    var spentInfo = sumExpenseInRange(db, budget.start, budget.end, basis);
    var amount = Math.round(Number(budget.amount) || 0);
    var spent = spentInfo.total;
    var scheduled = spentInfo.entries.filter(function (e) { return e.date > today; })
      .reduce(function (s, e) { return s + e.amount; }, 0);
    var remaining = amount - spent;
    var daysLeft = 0, phase = 'current';
    if (today < budget.start) {
      phase = 'upcoming';
      daysLeft = dayDiff(budget.start, budget.end) + 1;
    } else if (today > budget.end) {
      phase = 'ended';
      daysLeft = 0;
    } else {
      daysLeft = dayDiff(today, budget.end) + 1;
    }
    var daily = daysLeft > 0 ? Math.floor(Math.max(0, remaining) / daysLeft) : 0;
    return {
      spent: spent, amount: amount, remaining: remaining,
      spentCash: spentInfo.cashTotal, spentCard: spentInfo.cardTotal,
      excluded: spentInfo.excludedTotal, excludedBill: spentInfo.billTotal, excludedSaving: spentInfo.saveTotal,
      cardBillEntries: spentInfo.cardBillEntries, savingEntries: spentInfo.savingEntries,
      basis: basis === 'cash' ? 'cash' : 'all',
      scheduled: scheduled, spentActual: spent - scheduled,
      daysLeft: daysLeft, daily: daily, phase: phase,
      ratio: amount > 0 ? spent / amount : 0,
      totalDays: dayDiff(budget.start, budget.end) + 1,
      entries: spentInfo.entries

  }

  /* ---- 금액 계산기: + − × ÷ · 소수점 (원 단위 정수 결과) ----
     소수는 BigInt 유리수({n: 분자, d: 분모})로 계산해서 0.85×10000 같은 식에서도
     중간 부동소수점 오차가 생기지 않고, 최종 원화 금액만 Math.round 로 반올림한다.
     계산할 수 없으면(형식 오류·0으로 나누기) null */
  function calcTen(n) {                      /* 10^n (BigInt) */
    var s = '1';
    for (var i = 0; i < n; i++) s += '0';
    return BigInt(s);
  }
  function calcRat(tok) {                    /* "1234.5" → { n: 12345n, d: 10n } */
    var p = String(tok).split('.'), dec = p[1] || '';
    return { n: BigInt((p[0] || '0') + dec), d: calcTen(dec.length) };
  }
  function calcGcd(a, b) {                   /* 약분용 최대공약수 */
    if (a < BigInt(0)) a = -a;
    while (b) { var t = a % b; a = b; b = t; }
    return a || BigInt(1);
  }
  function calcRound(r) {                    /* 유리수 → Math.round 와 같은 정수 */
    var num = r.n, den = r.d;
    if (den < BigInt(0)) { num = -num; den = -den; }
    var a = num * BigInt(2) + den, b = den * BigInt(2);   /* floor(x + 0.5) */
    var q = a / b;
    if (a % b !== BigInt(0) && a < BigInt(0)) q = q - BigInt(1);
    return q;
  }
  function calcEval(expr) {
    var s = String(expr == null ? '' : expr)
      .replace(/×/g, '*').replace(/÷/g, '/').replace(/−/g, '-').replace(/\s+/g, '');
    if (!s) return null;
    s = s.replace(/[+\-*/]+$/, '');          /* 입력 중 끝에 붙은 연산자는 무시 */
    if (!s) return null;
    var NUM = '(?:\\d+(?:\\.\\d*)?|\\.\\d+)';
    if (!new RegExp('^' + NUM + '(?:[+\\-*/]' + NUM + ')*$').test(s)) return null;
    var toks = s.split(/([+\-*/])/);
    var vals = [], ops = [];
    function apply() {
      var b = vals.pop(), a = vals.pop(), op = ops.pop(), v;
      if (op === '*') v = { n: a.n * b.n, d: a.d * b.d };
      else if (op === '/') {
        if (b.n === BigInt(0)) return false;              /* 0으로 나누기 */
        v = { n: a.n * b.d, d: a.d * b.n };
      } else {
        v = { n: op === '-' ? a.n * b.d - b.n * a.d : a.n * b.d + b.n * a.d, d: a.d * b.d };
      }
      var g = calcGcd(v.n, v.d);
      if (g > BigInt(1)) { v.n = v.n / g; v.d = v.d / g; }
      vals.push(v);
      return true;
    }
    for (var t = 0; t < toks.length; t++) {
      if (t % 2 === 0) { vals.push(calcRat(toks[t])); continue; }
      var cur = toks[t];
      while (ops.length) {                    /* *,/ 가 +,- 보다 먼저 */
        var top = ops[ops.length - 1];
        if (top === '*' || top === '/' || (cur !== '*' && cur !== '/')) {
          if (!apply()) return null;
        } else break;
      }
      ops.push(cur);
    }
    while (ops.length) if (!apply()) return null;
    var q = calcRound(vals[0]);
    var MAX = BigInt('9007199254740991');      /* Number 로 정확히 옮길 수 있는 한계 */
    if (q > MAX || q < -MAX) return null;
    return Number(q);
  }

  function findBudgetAt(db, today) {
    var list = (db.budgets || []).filter(function (b) { return b.start && b.end; });
    var hit = list.filter(function (b) { return b.start <= today && today <= b.end; });
    if (hit.length) {
      hit.sort(function (a, b) { return a.start < b.start ? 1 : -1; });
      return hit[0];
    }
    return null;
  }

  /* ================= 색상 테마 (순수 계산 — DOM 없음) ================= */
  var THEME_KEYS = ['accent', 'income', 'bank', 'card'];
  var THEME_DEFAULTS = { accent: '#0FB9A5', income: '#2E8BF0', bank: '#F2545B', card: '#7B3FE4' };
  /* 설정 화면 팔레트 — 파스텔·중간·비비드·딥/모노톤을 8칸×4줄(32색)로 (첫 칸이 기본 색) */
  var THEME_PRESETS = {
    accent: ['#0FB9A5', '#14C4B8', '#2FA8C7', '#4C8DF0', '#6C5CE7', '#A55EEA', '#E84393', '#F2545B',
      '#12B886', '#39B980', '#8BC34A', '#F5B32B', '#F5893A', '#E67E22', '#E06B8B', '#B36AE2',
