  /* ---------------- 이름/헬퍼 ---------------- */
  function cardById(id) { return (db.cards || []).filter(function (c) { return c.id === id; })[0]; }
  function catById(type, id) {
    var list = (db.categories && db.categories[type]) || [];
    return list.filter(function (c) { return c.id === id; })[0];
  }
  function catName(type, id) { var c = catById(type, id); return c ? c.name : '미분류'; }
  function catEmoji(type, id) { var c = catById(type, id); return c ? (c.emoji || '•') : '•'; }
  /* 한 건의 아이콘 — 정기 항목에 직접 정한 이모지가 있으면 그것을 먼저 쓴다 */
  function entryIcon(e) {
    if (e && e.emoji && String(e.emoji).trim()) return String(e.emoji).trim();
    return catEmoji(e ? e.type : 'expense', e ? e.catId : null);
  }
  function methodName(m) { return m === 'credit' ? '신용카드' : m === 'debit' ? '체크카드' : '계좌이체'; }
  function methodLabel(e) {
    if (e.method === 'credit') { var c = cardById(e.cardId); return '신용카드 · ' + (c ? c.name : '카드'); }
    return methodName(e.method);
  }
  function monthTitle(ym) { var p = CORE.ymParts(ym); return p.y + '년 ' + p.m + '월'; }
  function amtClass(e) { return e.type === 'income' ? 'inc' : (e.method === 'credit' ? 'vio' : 'ex'); }
  function isInst(tx) { return CORE.normMonths(tx) > 1; }
  function installments() {
    return (db.transactions || []).filter(isInst).slice()
      .sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; });
  }

  /* 정기 항목 시트: 항목 칩 + 아이콘 미리보기 */
  function catButtons(type, selId) {
    return (db.categories[type] || []).map(function (c) {
      return '<button class="cat ' + (c.id === selId ? 'on' : '') + '" onclick="App.subCat(\'' + c.id + '\')">' +
        '<span>' + (c.emoji || '•') + '</span>' + esc(c.name) + '</button>';
    }).join('');
  }
  function syncSubPreview() {
    var el = document.getElementById('sub-prev-ic');
    if (!el) return;
    var cur = (document.getElementById('sub-emoji-cur') || {}).value || '';
    var type = (document.getElementById('sub-type') || {}).value || 'expense';
    var catId = (document.getElementById('sub-cat') || {}).value || null;
    el.textContent = cur || catEmoji(type, catId) || '•';
  }
  function setSubEmoji(g) {
    var hid = document.getElementById('sub-emoji-cur');
    if (hid) hid.value = g || '';
    var idx = -1;
    CAT_EMOJIS.forEach(function (r, i) { if (r[0] === g) idx = i; });
    Array.prototype.forEach.call(document.querySelectorAll('#sub-emojis button'), function (b, i) {
      b.classList.toggle('on', i === idx);
    });
    syncSubPreview();
  }

  /* ---------------- 렌더 ---------------- */
  function render() {
    applyTheme();
    var scr = document.getElementById('scr');
    if (st.route === 'calendar') scr.innerHTML = viewCalendar();
    else if (st.route === 'stats') scr.innerHTML = viewStats();
    else if (st.route === 'budget') scr.innerHTML = viewBudget();
    else scr.innerHTML = viewSettings();
    Array.prototype.forEach.call(document.querySelectorAll('#tabs button[data-tab]'), function (b) {
      b.classList.toggle('on', b.getAttribute('data-tab') === st.route);
    });
    scr.scrollTop = st._scroll || 0;
  }

  function headMonth() {
    return '' +
      '<div class="vhead">' +
      '  <div class="mnav">' +
      '    <button onclick="App.step(-1)" aria-label="이전 달">‹</button>' +
      '    <div class="ym">' + monthTitle(st.ym) + '</div>' +
      '    <button onclick="App.step(1)" aria-label="다음 달">›</button>' +
      '  </div>' +
      '  <button class="ghost" onclick="App.today()">오늘</button>' +
      '</div>';
  }

  /* ① 달력 ================================================= */
  /* 잔액 카드 — 다음 달 정기구독(통장 출금분)을 미리 뺀 '사용 가능 잔액'을 기본으로 보여 준다.
     설정에서 끄면 예전처럼 이번 달 통장 잔액을 그대로 보여 준다. */
  function balTitle(s, ym) {
    var spare = s.subReserveOn !== false;
    var n = Number(String(ym).slice(5, 7));
    return n + '월 ' + (spare ? '사용 가능 잔액' : '통장 잔액') +
      (!spare && (db.settings || {}).carryOver ? ' (이월 포함)' : '');
  }
  function balShown(s) { return s.subReserveOn !== false ? s.usableBalance : s.balance; }
  function balNoteHtml(s) {
    if (s.subReserveOn === false || !(s.nextSubReserve > 0)) return '';
    return '<div class="bsub">다음 달 구독 -' + fmt(s.nextSubReserve) + '원 · 통장 ' + fmt(s.balance) + '원</div>';
  }
  function viewCalendar() {
    var s = CORE.monthFull(db, st.ym);
    var cardRows = (db.cards || []).map(function (c) {
      return { c: c, v: s.byCard[c.id] || 0 };
    });
    var cardTotal = cardRows.reduce(function (a, r) { return a + r.v; }, 0);
    var others = (s.byCard['__none__'] || 0);
    var maxCard = Math.max.apply(null, cardRows.map(function (r) { return r.v; }).concat([1]));

    var html = headMonth();
    html += '<div class="wrap">';

    /* 통장 잔액 카드 (현금 흐름 기준 · 다음 달 구독 미리 빼기) */
    html += '<div class="bal">' +
      '<div class="t">' + balTitle(s, st.ym) + '</div>' +
      '<div class="v">' + fmt(balShown(s)) + '<small>원</small></div>' +
      balNoteHtml(s) +
      '<div class="r">' +
      '  <div><span>수입</span><b>' + fmt(s.income) + '</b></div>' +
      '  <div><span>통장 지출</span><b>' + fmt(s.cashOut) + '</b></div>' +
      '  <div><span>전월 이월</span><b>' + fmt(s.carryIn) + '</b></div>' +
      '</div>' +
      '</div>';

    /* 신용카드 사용액 (1일~말일) */
    html += '<div class="sect-h"><b>신용카드 사용액</b><span class="l">' +
      Number(st.ym.slice(5)) + '/1 ~ ' + Number(st.ym.slice(5)) + '/' + CORE.daysInMonth(Number(st.ym.slice(0, 4)), Number(st.ym.slice(5))) +
      ' 합계 ' + won(cardTotal) + '</span></div>';
    html += '<div class="cardstrip">';
    if (!cardRows.length) {
      html += '<div class="ctile empty" onclick="App.goto(\'settings\')">설정에서 신용카드를<br>추가해 보세요</div>';
    } else {
      cardRows.forEach(function (r) {
        var pct = Math.round((r.v / maxCard) * 100);
        var cc = r.c.color || 'var(--card-color)';
        html += '<div class="ctile"><div class="ct-top"><i style="background:' + cc + '"></i>' + esc(r.c.name) + '</div>' +
          '<div class="ct-amt vio">' + fmt(r.v) + '<span style="font-size:10.5px;font-weight:700;color:#8B929C">원</span></div>' +
          '<div class="ct-bar"><i style="width:' + pct + '%;background:' + cc + '"></i></div></div>';
      });
    }
    html += '</div>';

    /* 달력 */
    html += '<div class="cal">' + calGrid(s) + '</div>';

    /* 선택한 날짜 내역 (달력 바로 아래) */
    html += selDayPanel(s, selectedDate());

    /* 예산 미니 */
    var bud = CORE.findBudgetAt(db, today()) || (db.budgets || [])[0];
    if (bud) {
      var bs = CORE.budgetStats(db, bud, today(), 'all');
      var barCls = bs.ratio >= 1 ? 'over' : bs.ratio >= 0.8 ? 'warn' : '';
      var pct = Math.min(100, Math.round(bs.ratio * 100));
      html += '<div class="sect-h"><b>예산</b><span class="l">' + esc(bud.label || '예산') + '</span></div>';
      html += '<div class="bmini" onclick="App.goto(\'budget\')">' +
        '<div class="top"><span class="nm">' + esc(bud.label || '예산') + '</span><span class="pr">' + shortDate(bud.start) + ' ~ ' + shortDate(bud.end) + '</span></div>' +
        '<div class="bar"><i class="' + barCls + '" style="width:' + pct + '%"></i></div>' +
        '<div class="bot"><span><span class="k">남은</span>' + won(bs.remaining) + '</span>' +
        '<span><span class="k">하루</span>' + won(bs.daily) + '</span></div></div>';
    }

    html += '</div>';
    return html;
  }

  function shortDate(s) { var p = s.split('-'); return Number(p[1]) + '/' + Number(p[2]); }
  function dateLabel(s) {
    if (!/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
    var p = s.split('-').map(Number);
    var dow = ['일', '월', '화', '수', '목', '금', '토'][new Date(p[0], p[1] - 1, p[2]).getDay()];
    return p[0] + '년 ' + p[1] + '월 ' + p[2] + '일 (' + dow + ')';
  }
  function addDays(s, n) {
    var p = s.split('-').map(Number);
    var d = new Date(p[0], p[1] - 1, p[2] + n);
    return CORE.ymd(d.getFullYear(), d.getMonth() + 1, d.getDate());
  }

  function calGrid(s) {
    var p = CORE.ymParts(st.ym), y = p.y, m = p.m;
    var dim = CORE.daysInMonth(y, m);
    var first = new Date(y, m - 1, 1).getDay();
    var prevDim = CORE.daysInMonth(y, m - 1 === 0 ? 12 : m - 1);
    var byDay = {};
    s.entries.forEach(function (e) {
      var d = Number(e.date.slice(8));
      if (!byDay[d]) byDay[d] = { cash: 0, card: 0, i: 0, fx: false };
      if (e.type === 'income') byDay[d].i += e.amount;
      else if (e.method === 'credit') byDay[d].card += e.amount;
      else byDay[d].cash += e.amount;
      if (e.kind === 'fixed') byDay[d].fx = true;
    });

    var h = '<div class="calleg"><span><i class="i"></i>수입</span><span><i class="c"></i>통장</span><span><i class="v"></i>카드</span></div>' +
      '<div class="wd"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div><div class="grid">';
    var cells = [];
    for (var i = 0; i < first; i++) {
      var pd = prevDim - first + 1 + i;
      cells.push({ out: true, d: pd, dow: i });
    }
    for (var d = 1; d <= dim; d++) {
      cells.push({ out: false, d: d, dow: (first + d - 1) % 7 });
    }
    while (cells.length % 7 !== 0) {
      cells.push({ out: true, d: cells.length - (first + dim) + 1, dow: (cells.length) % 7 });
    }
    var t = today();
    cells.forEach(function (c) {
      var cls = ['cell'];
      if (c.dow === 0) cls.push('sun');
      if (c.dow === 6) cls.push('sat');
      if (c.out) cls.push('out');
      var isToday = !c.out && t === st.ym + '-' + CORE.pad2(c.d);
      if (isToday) cls.push('today');
      if (!c.out && selectedDate() === st.ym + '-' + CORE.pad2(c.d)) cls.push('sel');
      var info = !c.out ? byDay[c.d] : null;
      h += '<button class="' + cls.join(' ') + '" onclick="App.tapDay(' + (c.out ? 0 : c.d) + ')">' +
        '<i class="dn">' + c.d + '</i>';
      if (info) {
        var rows = [];
        if (info.i) rows.push(['i', '+' + fmt(info.i)]);
        if (info.cash) rows.push(['c', fmt(info.cash)]);
        if (info.card) rows.push(['v', fmt(info.card)]);
        rows.forEach(function (r) {
          var long = r[1].length >= 10 ? ' long' : '';
          h += '<i class="am ' + r[0] + long + '">' + r[1] + '</i>';
        });
        if (!rows.length && info.fx) h += '<i class="am">·</i>';
      }
      h += '</button>';
    });
    h += '</div>';
    return h;
  }

  /* 선택한 날짜 내역 패널 (달력 바로 아래) */
  function selDayPanel(s, date) {
    var items = s.entries.filter(function (e) { return e.date === date; });
    var inc = 0, cash = 0, card = 0;
    items.forEach(function (e) {
      if (e.type === 'income') inc += e.amount;
      else if (e.method === 'credit') card += e.amount;
      else cash += e.amount;
    });
    var p = date.split('-').map(Number);
    var dow = ['일', '월', '화', '수', '목', '금', '토'][new Date(p[0], p[1] - 1, p[2]).getDay()];

    var dayTot = '';
    if (inc > 0 || cash + card > 0) {
      if (inc > 0) dayTot += '<span class="in">수입<b>' + won(inc) + '</b></span>';
      dayTot += '<span class="out">지출<b>' + won(cash + card) + '</b></span>';
    }

    var h = '<div class="selday">' +
      '<div class="sd-head"><div class="sd-date">' + p[1] + '월 ' + p[2] + '일 <span class="dow">(' + dow + ')</span></div>' +
      (dayTot ? '<div class="sd-tot">' + dayTot + '</div>' : '') +
      '<button class="sd-add" onclick="App.openInput({date:\'' + date + '\'})">+ 내역</button></div>' +
      '<div class="sd-sum">' +
      '<span><i class="d-in"></i>수입<b class="inc">' + fmt(inc) + '</b></span>' +
      '<span><i class="d-out"></i>통장<b class="ex">' + fmt(cash) + '</b></span>' +
      '<span><i class="d-card"></i>카드<b class="vio">' + fmt(card) + '</b></span>' +
      '</div>';
    if (!items.length) {
      h += '<div class="sd-empty">이 날 기록이 없어요</div>';
    } else {
      h += '<div class="items">';
      items.forEach(function (e) {
        var nm = e.kind === 'fixed' ? (e.name || '정기') : catName(e.type, e.catId);
        var tag = '';
        if (e.kind === 'installment') tag = '<span class="tag inst">' + e.seq + '/' + e.months + '회차</span>';
        if (e.kind === 'fixed') tag = '<span class="tag fix">정기</span>';
        h += '<button class="item" onclick="App.openEntry(\'' + e.kind + '\',\'' + (e.txId || e.subId || '') + '\')">' +
          '<span class="ic">' + entryIcon(e) + '</span>' +
          '<span class="mid"><span class="nm">' + esc(nm) + tag + '</span>' +
          '<span class="meta">' + esc(methodLabel(e)) + (e.memo ? ' · ' + esc(e.memo) : '') + '</span></span>' +
          '<span class="amt ' + amtClass(e) + '">' + (e.type === 'income' ? '+' : '-') + fmt(e.amount) + '</span></button>';
      });
      h += '</div>';
    }
    h += '</div>';
    return h;
  }

  /* ② 통계 ================================================= */
  function viewStats() {
    var s = CORE.monthFull(db, st.ym);
    var cs = s.consume || { expense: s.expense, cashOut: s.cashOut, cardOut: s.cardOut, entries: s.expenseEntries };
    var total = cs.expense;
    var byCat = {};
    cs.entries.forEach(function (e) {
      var k = e.catId || '__none__';
      (byCat[k] = byCat[k] || []).push(e);
    });
    var rows = Object.keys(byCat).map(function (k) {
      var items = byCat[k];
      return {
        id: k,
        v: items.reduce(function (a, e) { return a + e.amount; }, 0),
        n: items.length,
        items: items
      };
    }).sort(function (a, b) { return b.v - a.v || (a.id < b.id ? -1 : 1); });

    var h = headMonth();
    h += '<div class="wrap">';

    /* 이 달 총 지출 + 수입/통장/카드 요약 */
    h += '<div class="stsum">' +
      '<div class="lbl">' + Number(st.ym.slice(5)) + '월 총 지출</div>' +
      '<div class="big">' + fmt(total) + '<small>원</small></div>' +
      '<div class="r3">' +
      '  <div><span>수입</span><b class="inc">' + fmt(s.income) + '</b></div>' +
      '  <div><span>통장 지출</span><b class="ex">' + fmt(cs.cashOut) + '</b></div>' +
      '  <div><span>카드 지출</span><b class="vio">' + fmt(cs.cardOut) + '</b></div>' +
      '</div>' +
      ((s.excludedBill || s.excludedSaving) ? '<div class="hint" style="margin-top:8px">' + excludeNote(s, '소비 집계') + '</div>' : '') +
      '</div>';

    if (!total || !rows.length) {
      h += '<div class="empty">이 달 지출 기록이 없어요</div></div>';
      return h;
    }

    /* 도넛 차트 + 상위 카테고리 범례 */
    var R = 52, C = 2 * Math.PI * R;
    var gap = rows.length > 1 ? 1.6 : 0;
    var off = 0, segs = '', leg = '';
    var top = rows.slice(0, 5);
    var restV = 0;
    rows.slice(5).forEach(function (r) { restV += r.v; });

    rows.forEach(function (r) {
      var len = total ? C * (r.v / total) : 0;
      var draw = Math.max(len - gap, 0.6);
      segs += '<circle cx="64" cy="64" r="' + R + '" fill="none" stroke="' + catColor('expense', r.id) +
        '" stroke-width="17" stroke-dasharray="' + draw.toFixed(2) + ' ' + (C - draw).toFixed(2) +
        '" stroke-dashoffset="' + (-off).toFixed(2) + '"></circle>';
      off += len;
    });
    top.forEach(function (r) {
      leg += '<div class="lg"><i style="background:' + catColor('expense', r.id) + '"></i>' +
        '<span>' + esc(r.id === '__none__' ? '미분류' : catName('expense', r.id)) + '</span>' +
        '<em>' + pctText(r.v, total) + '</em></div>';
    });
    if (restV) {
      leg += '<div class="lg"><i style="background:#C3C9D1"></i><span>그 외 ' + (rows.length - top.length) + '개</span>' +
        '<em>' + pctText(restV, total) + '</em></div>';
    }

    h += '<div class="donutcard"><div class="donutwrap">' +
      '<svg viewBox="0 0 128 128">' +
      '<circle cx="64" cy="64" r="' + R + '" fill="none" stroke="#F1F3F6" stroke-width="17"></circle>' + segs + '</svg>' +
      '<div class="ctr"><span class="k">' + Number(st.ym.slice(5)) + '월 지출</span><b>' + fmt(total) + '</b></div></div>' +
      '<div class="dleg">' + leg + '</div></div>';

    /* 카테고리별 지출 목록 (행을 누르면 세부 내역 펼침) */
    h += '<div class="sect-h"><b>카테고리별 지출</b><span class="l">' + rows.length + '개 · ' + cs.entries.length + '건</span></div>';
    h += '<div class="stcard">';
    rows.forEach(function (r) {
      var col = catColor('expense', r.id);
      var p = total ? r.v / total * 100 : 0;
      var open = st.statCat === r.id;
      var nm = r.id === '__none__' ? '미분류' : catName('expense', r.id);
      h += '<button class="strow ' + (open ? 'open' : '') + '" onclick="App.toggleStatCat(\'' + r.id + '\')">' +
        '<span class="ic">' + catEmoji('expense', r.id) + '</span>' +
        '<span class="mid"><span class="l1"><span class="nm">' + esc(nm) + '</span>' +
        '<span class="amt">' + fmt(r.v) + '</span><span class="pc">' + pctText(r.v, total) + '</span></span>' +
        '<span class="sbar"><i style="width:' + Math.max(2, Math.round(p)) + '%;background:' + col + '"></i></span>' +
        '<span class="cnt">' + r.n + '건' + (open ? ' · 접기' : '') + '</span></span></button>';
      if (open) {
        h += '<div class="std">';
        r.items.slice().sort(function (a, b) {
          return a.date < b.date ? 1 : a.date > b.date ? -1 : b.amount - a.amount;
        }).forEach(function (e) {
          var isFix = e.kind === 'fixed';
          var nm2 = isFix ? (e.name || '정기') : (e.memo || catName(e.type, e.catId));
          var tag = '';
          if (isFix) tag = '<span class="tag fix">정기</span>';
          else if (e.kind === 'installment') tag = '<span class="tag inst">' + e.seq + '/' + e.months + '회차</span>';
          var meta = shortDate(e.date) + ' · ' + methodLabel(e);
          if (!isFix && e.memo && nm2 !== e.memo) meta += ' · ' + e.memo;
          h += '<button class="item" onclick="App.openEntry(\'' + e.kind + '\',\'' + (e.txId || e.subId || '') + '\')">' +
            '<span class="ic">' + entryIcon(e) + '</span>' +
            '<span class="mid"><span class="nm">' + esc(nm2) + tag + '</span>' +
            '<span class="meta">' + esc(meta) + '</span></span>' +
            '<span class="amt ' + amtClass(e) + '">' + (e.type === 'income' ? '+' : '-') + fmt(e.amount) + '</span></button>';
        });
        h += '</div>';
      }
    });
    h += '</div>';
    h += '<div class="st-note">카테고리를 누르면 그 달 세부 내역이 펼쳐져요</div>';
    h += '<div style="height:10px"></div></div>';
    return h;
  }

  /* ③ 예산 ================================================= */
  /* 예산에서 뺀 항목을 짧게 알려 주는 문구 */
  function excludeNote(bs, where) {
    var parts = [];
    if (bs.excludedBill) parts.push('카드대금 ' + won(bs.excludedBill));
    if (bs.excludedSaving) parts.push('저축 ' + won(bs.excludedSaving));
    if (!parts.length) return '';
    return parts.join(' · ') + '은 ' + (where || '예산 사용액') + '에서 제외했어요';
  }
  function viewBudget() {
    var list = (db.budgets || []).slice().sort(function (a, b) { return a.start < b.start ? 1 : -1; });
    var cur = st.budgetId ? list.filter(function (b) { return b.id === st.budgetId; })[0] : null;
    if (!cur) cur = CORE.findBudgetAt(db, today()) || list[0] || null;

    var h = '<div class="vhead"><div class="ttl">예산</div>' +
      '<button class="ghost" onclick="App.openBudgetForm()">+ 새 기간</button></div>';

    h += '<div class="wrap">';
    if (!cur) {
      h += '<div class="card" style="text-align:center;padding:26px 14px">' +
        '<div style="font-size:13px;font-weight:800;margin-bottom:14px">아직 예산 기간이 없어요</div>' +
        '<button class="btn" onclick="App.openBudgetForm()">예산 기간 만들기</button></div>';
      h += '</div>';
      return h;
    }

    var basis = 'all';                             /* 예산은 항상 전체 소비(카드 포함) 기준 */
    var basisName = '순수 소비 기준';              /* 카드대금·저축 제외 */
    var bs = CORE.budgetStats(db, cur, today(), basis);
    var pct = Math.min(100, Math.round(bs.ratio * 100));
    var barCls = bs.ratio >= 1 ? 'over' : bs.ratio >= 0.8 ? 'warn' : '';
    var phaseTxt = bs.phase === 'upcoming' ? '아직 시작 전' : bs.phase === 'ended' ? '기간 종료' : '진행 중';

    h += '<div class="bbig">' +
      '<div style="display:flex;justify-content:space-between;align-items:flex-start">' +
      '<div><div class="lbl">' + esc(cur.label || '예산') + '</div>' +
      '<div class="per">' + cur.start + ' ~ ' + cur.end + ' · ' + bs.totalDays + '일 · ' + phaseTxt + '</div></div>' +
      '<button class="ghost" onclick="App.openBudgetForm(\'' + cur.id + '\')">수정</button></div>' +
      '<div class="rem ' + (bs.remaining < 0 ? 'ex' : '') + '">' + fmt(bs.remaining) + '<small>원 남음</small></div>' +
      '<div class="sub2">총 예산 ' + won(bs.amount) + ' · ' + basisName + ' 지출 ' + won(bs.spent) +
      (bs.scheduled ? ' <span style="color:#8B929C">(예정 ' + won(bs.scheduled) + ' 포함)</span>' : '') + '</div>' +
      (bs.excluded ? '<div class="hint" style="margin-top:3px">' + excludeNote(bs, '예산 사용액') + '</div>' : '') +
      '<div class="grid2">' +
      '<div class="kbox"><div class="k">통장 지출 (계좌·체크)</div><div class="v ex" style="font-size:13px">' + won(bs.spentCash) + '</div></div>' +
      '<div class="kbox"><div class="k">신용카드 사용액 (다음 달 대금)</div><div class="v vio" style="font-size:13px">' + won(bs.spentCard) + '</div></div>' +
      '</div>' +
      '<div class="bar"><i class="' + barCls + '" style="width:' + pct + '%"></i></div>' +
      '<div style="display:flex;justify-content:space-between;font-size:11px;color:#8B929C;font-weight:700">' +
      '<span>' + pct + '% 사용</span><span>' + (bs.phase === 'ended' ? '기간이 끝났어요' : '남은 ' + bs.daysLeft + '일') + '</span></div>' +
      '<div class="daily"><span class="k">남은 기간 하루 권장 지출</span><b>' + won(bs.daily) + '</b></div>' +
      '</div>';

    /* 기간 전환 */
    h += '<div class="chips" style="padding-left:0;padding-right:0">';
    list.forEach(function (b) {
      var active = b.id === cur.id;
      h += '<button class="chip ' + (active ? 'on' : '') + '" onclick="App.pickBudget(\'' + b.id + '\')">' + esc(b.label || shortDate(b.start)) + '</button>';
    });
    h += '</div>';

    /* 예산 내 지출 요약 */
    var byCat = {};
    bs.entries.forEach(function (e) { byCat[e.catId] = (byCat[e.catId] || 0) + e.amount; });
    var catRows = Object.keys(byCat).map(function (k) { return { id: k, v: byCat[k] }; })
      .sort(function (a, b) { return b.v - a.v; }).slice(0, 5);
    if (catRows.length) {
      h += '<div class="sect-h"><b>이 기간 지출 Top</b><span class="l">' + basisName + ' · ' + won(bs.spent) + '</span></div><div class="card">';
      catRows.forEach(function (r) {
        var p = bs.spent ? Math.round((r.v / bs.spent) * 100) : 0;
        h += '<div style="margin-bottom:9px">' +
          '<div style="display:flex;justify-content:space-between;gap:8px;font-size:12px;font-weight:700"><span style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + catEmoji('expense', r.id) + ' ' + esc(catName('expense', r.id)) + '</span><span style="flex:0 0 auto">' + won(r.v) + ' <span class="muted">' + p + '%</span></span></div>' +
          '<div class="bar" style="height:5px;margin:5px 0 0"><i style="width:' + p + '%"></i></div></div>';
      });
      h += '</div>';
    }

    /* 전체 기간 목록 */
    h += '<div class="sect-h"><b>전체 예산 기간</b><span class="l">' + list.length + '개</span></div>';
    h += '<div class="slist">';
    list.forEach(function (b) {
      var s2 = CORE.budgetStats(db, b, today(), basis);
      h += '<div class="srow">' +
        '<div class="txt"><div class="t1">' + esc(b.label || '예산') + '</div>' +
        '<div class="t2">' + shortDate(b.start) + ' ~ ' + shortDate(b.end) + ' · 남은 ' + won(s2.remaining) + '</div></div>' +
        '<button class="act" onclick="App.openBudgetForm(\'' + b.id + '\')">수정</button>' +
        '<button class="act d" onclick="App.deleteBudget(\'' + b.id + '\')">삭제</button></div>';
    });
    h += '</div>';
    return h;
  }

  /* ---------------- 색상 테마 (설정 화면) ---------------- */
  /* 미리보기는 지금 보는 달의 실제 숫자를 써서, 고른 색이 실제 화면에서 어떻게 보일지 그대로 보여 준다 */
  function themePreviewRows(s) {
    var pick = { i: null, e: null, v: null };
    (s.entries || []).forEach(function (e) {
      if (e.type === 'income') { if (!pick.i) pick.i = e; }
      else if (e.method === 'credit') { if (!pick.v) pick.v = e; }
      else if (!pick.e) pick.e = e;
    });
    function row(cls, sign, e, fbName, fbAmt) {
      var nm = e ? ((e.memo || '').trim() || (e.kind === 'fixed' ? (e.name || '정기') : catName(e.type, e.catId))) : fbName;
      return '<div class="tprev-row"><span class="ic">' + (e ? entryIcon(e) : '•') + '</span>' +
        '<span class="nm">' + esc(nm) + '</span>' +
        '<span class="amt ' + cls + '">' + sign + (e ? fmt(e.amount) : fbAmt) + '</span></div>';
    }
    return row('inc', '+', pick.i, '급여', '2,400,000') +
      row('ex', '-', pick.e, '지하철·버스', '9,000') +
      row('vio', '-', pick.v, '겨울 부츠', '120,000');
  }
  function themePreviewHtml() {
    var ym = st.ym || CORE.ymOf(today());
    var s = CORE.monthFull(db, ym);
    return '<div class="tprev">' +
      '<div class="bal">' +
      '  <div class="t">' + balTitle(s, ym) + '</div>' +
      '  <div class="v">' + fmt(balShown(s)) + '<small>원</small></div>' +
      balNoteHtml(s) +
      '  <div class="r"><div><span>수입</span><b>' + fmt(s.income) + '</b></div>' +
      '    <div><span>통장 지출</span><b>' + fmt(s.cashOut) + '</b></div>' +
      '    <div><span>전월 이월</span><b>' + fmt(s.carryIn) + '</b></div></div>' +
      '</div>' +
      '<div class="tprev-rows">' + themePreviewRows(s) + '</div>' +
      '<div class="tprev-acts"><span class="btn" style="display:block;text-align:center">저장하기</span><span class="chip on">이번 달</span></div>' +
      '<div class="bar"><i style="width:64%"></i></div>' +
      '</div>';
  }
  function themeGroupHtml(key) {
    var lb = THEME_LABELS[key], cur = themeColors()[key];
    var h = '<div class="tgroup" data-theme="' + key + '">' +
      '<div class="trow"><span class="tcur" style="background:' + cur + '"></span>' +
      '<div class="ttx"><b>' + lb[0] + '</b><span>' + lb[1] + '</span></div>' +
      '<span class="thex">' + cur + '</span>' +
      '<button class="act" onclick="App.resetThemeKey(\'' + key + '\')">기본</button></div>' +
      '<div class="tpal">';
    (CORE.THEME_PRESETS[key] || []).forEach(function (p) {
      h += '<button type="button" class="tsw-chip' + (p === cur ? ' on' : '') + '"' +
        ' data-hex="' + p + '" style="--sw:' + p + '" aria-label="' + lb[0] + ' ' + p + '"' +
        ' onclick="App.setThemeColor(\'' + key + '\',\'' + p + '\')"></button>';
    });
    h += '</div><div class="tfoot">' +
      '<label class="tcustom">직접 고르기' +
      '<input type="color" value="' + cur + '" aria-label="' + lb[0] + ' 색 직접 고르기"' +
      ' oninput="App.setThemeColor(\'' + key + '\',this.value,false)" onchange="App.setThemeColor(\'' + key + '\',this.value)"></label>' +
      '<span class="thint" style="margin:0">어떤 색이든 고를 수 있어요</span></div></div>';
    return h;
  }

  /* 색상 테마 — 설정에서 한 줄로 접어 두고, 누르면 미리보기·팔레트가 펼쳐진다 */
  function themeDotsHtml() {
    var c = themeColors();
    return CORE.THEME_KEYS.map(function (k) {
      return '<i class="tdot" data-theme="' + k + '" style="background:' + c[k] + '"></i>';
    }).join('');
  }
  function themeSectionHtml() {
    var body = '<div class="tbody">' + themePreviewHtml();
    CORE.THEME_KEYS.forEach(function (k) { body += themeGroupHtml(k); });
    body += '<button class="resetbtn" onclick="App.resetTheme()">기본 색상으로 초기화</button>' +
      '<div class="thint">고른 색은 이 기기에 저장되고, JSON 백업에도 함께 담겨요.</div></div>';
    return '<div class="themecard' + (st.themeOpen ? ' open' : '') + '" id="themecard">' +
      '<button type="button" class="themerow" onclick="App.toggleTheme()" aria-expanded="' +
      (st.themeOpen ? 'true' : 'false') + '" aria-controls="themebody"><b>색상 테마</b>' +
      '<span class="tdots">' + themeDotsHtml() + '</span>' +
      '<svg class="tchev" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button>' +
      '<div class="themebody" id="themebody"' + (st.themeOpen ? ' style="height:auto"' : '') + '>' + body + '</div></div>';
  }

  /* ④ 설정 ================================================= */

    /* 색상 테마 (접었다 펼치는 토글) */

    h += '<div class="srow"><div class="txt"><div class="t1">지출 항목</div><div class="t2">' + (db.categories.expense || []).map(function (c) { return esc((c.emoji || '•') + ' ' + c.name); }).join(' · ') + '</div></div>' +
      '<button class="act" onclick="App.openCatList(\'expense\')">관리</button></div>';
    h += '<div class="srow"><div class="txt"><div class="t1">수입 항목</div><div class="t2">' + (db.categories.income || []).map(function (c) { return esc((c.emoji || '•') + ' ' + c.name); }).join(' · ') + '</div></div>' +
      '<button class="act" onclick="App.openCatList(\'income\')">관리</button></div>';
    h += '</div>';

    /* 정기 */
    h += '<div class="sect-h"><b>정기 지출·수입</b><span class="l">' + (db.subscriptions || []).length + '개</span></div>';
    h += '<div class="slist">';
    (db.subscriptions || []).forEach(function (s) {
      var dayTxt = s.day === 'end' ? '매월 말일' : '매월 ' + s.day + '일';
      var subStart = s.startMonth ? String(s.startMonth).slice(0, 7) : '';
      var future = subStart && CORE.cmpYm(subStart, CORE.ymOf(today())) > 0;
      h += '<div class="srow">' +
        '<button class="switch ' + (s.active === false ? '' : 'on') + '" onclick="App.toggleSub(\'' + s.id + '\')"><i></i></button>' +
        '<span class="sic">' + esc(s.emoji || catEmoji(s.type, s.catId)) + '</span>' +
        '<div class="txt"><div class="t1">' + esc(s.name) + ' <span class="' + (s.type === 'income' ? 'inc' : 'ex') + '">' + (s.type === 'income' ? '+' : '-') + fmt(s.amount) + '</span></div>' +
        '<div class="t2">' + dayTxt + ' · ' + methodLabel({ method: s.method, cardId: s.cardId }) +

        '<span class="iprog"><i style="width:' + pct + '%"></i></span>' +

      '<input id="startBal" value="' + fmt(db.settings.startBalance || 0) + '" inputmode="numeric" style="width:116px;text-align:right;border:1px solid #EDEFF2;border-radius:9px;padding:6px 8px;font-size:16px;font-weight:800" onblur="App.saveStartBalance(this)">' +
      '</div></div>';

    /* 데이터 */

      '<div class="srow"><div class="txt"><div class="t1">JSON 백업 내보내기</div></div>' +
      '<button class="act" onclick="App.exportJSON()">내보내기</button></div>' +
      '<div class="srow"><div class="txt"><div class="t1">백업 가져오기</div></div>' +
      '<label class="act" style="cursor:pointer">파일 선택<input type="file" accept="application/json,.json" style="display:none" onchange="App.importJSON(this)"></label></div>' +
      '<div class="srow"><div class="txt"><div class="t1">데모 데이터 다시 채우기</div><div class="t2">현재 기록 삭제</div></div>' +
      '<button class="act" onclick="App.reseed()">채우기</button></div>' +
      '<div class="srow"><div class="txt"><div class="t1">모두 지우기</div></div>' +
      '<button class="act d" onclick="App.clearAll()">지우기</button></div>' +

    h += '</div>';

  }

  /* ---------------- 금액 계산기 ---------------- */
  var CALC_OPS = '+\u2212×÷';            /* 내부 기호: + − × ÷ */
  var calcPrev = null;

  function calcFmtExp(expr) {
    return String(expr || '')
      .replace(/[+\-\u2212×÷]/g, function (m) { return ' ' + m + ' '; })
      .replace(/\d+(?:\.\d*)?/g, function (m) {
        var p = m.split('.');
        var head = p[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
        return p.length > 1 ? head + '.' + p[1] : head;
      })
      .replace(/\s+/g, ' ').trim();
  }
  function calcBtnHtml(id) {
    return '<button type="button" class="calcbtn' + (st.calc && st.calc.open && st.calc.target === id ? ' on' : '') + '"' +
      ' data-calc="' + id + '" onclick="App.toggleCalc(\'' + id + '\')" aria-label="계산기" title="계산기">' +
      '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="2.6" width="16" height="18.8" rx="3.2"/>' +
      '<path d="M8 7.4h8M8.5 12h.01M12 12h.01M15.5 12h.01M8.5 16h.01M12 16h.01M15.5 16h.01"/></svg></button>';
  }
  function calcPanelHtml() {
    var keys = [
      ['C', 'fn'], ['←', 'fn'], ['÷', 'op'], ['×', 'op'],
      ['7', ''], ['8', ''], ['9', ''], ['−', 'op'],
      ['4', ''], ['5', ''], ['6', ''], ['+', 'op'],
      ['1', ''], ['2', ''], ['3', ''], ['=', 'eq'],
      ['0', ''], ['00', ''], ['.', '']
    ];
    var h = '<div class="calcpanel" id="calc-panel"><div class="calcline">' +
      '<div class="exp" id="calc-exp"></div><div class="eq" id="calc-eq"></div></div><div class="calcgrid">';
    keys.forEach(function (k) {
      h += '<button type="button" class="' + k[1] + '" data-k="' + k[0] + '" onclick="App.calcKey(\'' + k[0] + '\')">' + k[0] + '</button>';
    });
    h += '</div></div>';
    return h;
  }
  /* 계산 결과를 금액칸·미리보기에 반영 (시트를 다시 그리지 않아 화면이 튀지 않음) */
  function calcSync() {
    var c = st.calc;
    if (!c || !c.open) return;
    var v = CORE.calcEval(c.expr);
    c.invalid = !!c.expr && v === null;
    var input = document.getElementById(c.target);
    if (input && !c.invalid) input.value = (c.expr && v !== null) ? fmt(v) : '';
    var ex = document.getElementById('calc-exp');
    if (ex) ex.textContent = calcFmtExp(c.expr);
    var eq = document.getElementById('calc-eq');
    if (eq) {
      eq.className = 'eq' + (c.invalid ? ' bad' : '');
      eq.textContent = !c.expr ? '= 0원' : c.invalid ? '계산할 수 없어요' : '= ' + won(v);
    }
  }
  /* 열린 계산기를 해당 금액칸 밑에 붙이고, 닫혔거나 대상이 바뀌면 지운다 */
  function calcMount() {
    var old = document.getElementById('calc-panel');
    if (old && old.parentNode) old.parentNode.removeChild(old);
    var c = st.calc;
    var on = !!(c && c.open);
    if (calcPrev && (!on || c.target !== calcPrev)) {
      var p = document.getElementById(calcPrev);
      if (p) p.removeAttribute('readonly');
      calcPrev = null;
    }
    Array.prototype.forEach.call(document.querySelectorAll('.calcbtn'), function (b) {
      b.classList.toggle('on', on && b.getAttribute('data-calc') === c.target);
    });
    if (!on) return;
    var input = document.getElementById(c.target);
    if (!input) return;
    var host = input.closest('.amountbox') || input.closest('.line');
    if (!host) return;
    host.insertAdjacentHTML('afterend', calcPanelHtml());
    input.setAttribute('readonly', 'readonly');   /* 계산기 조작 중에는 키보드를 열지 않음 */
    calcPrev = c.target;
    calcSync();
  }
  /* 계산기가 시트 아래로 잘리지 않게 .sh-body만 살짝 스크롤 */
  function calcReveal() {
    var panel = document.getElementById('calc-panel');
    var body = document.querySelector('#modal .sh-body');
    if (!panel || !body) return;
    var pr = panel.getBoundingClientRect(), br = body.getBoundingClientRect();
    if (pr.bottom > br.bottom - 6) body.scrollTop += (pr.bottom - br.bottom) + 10;
  }
  function calcKey(k) {
    var c = st.calc;
    if (!c || !c.open) return;
    if (k === 'C') { c.expr = ''; c.fresh = true; }
    else if (k === '←') { c.expr = c.expr.slice(0, -1); c.fresh = false; }
    else if (k === '=') {
      var v = CORE.calcEval(c.expr);
      if (v === null) { if (c.expr) toast('계산식을 확인해 주세요'); return; }
      c.expr = String(v); c.fresh = true;
    } else if (CALC_OPS.indexOf(k) >= 0) {
      if (!c.expr) return;                       /* 숫자 없이 연산자로 시작하지 않음 */
      var last = c.expr.slice(-1);
      if (CALC_OPS.indexOf(last) >= 0) c.expr = c.expr.slice(0, -1) + k;   /* 연산자 연속 입력은 교체 */
      else c.expr += k;
      c.fresh = false;
    } else if (k === '.') {
      var segd = c.expr.split(/[+\-\u2212×÷]/).pop();
      if (segd.indexOf('.') >= 0) return;      /* 한 숫자 안에 소수점은 한 번만 */
      if (c.fresh) c.expr = '0.';               /* = 뒤에는 새 숫자 0.5 로 */
      else if (!segd) c.expr += '0.';           /* 처음·연산자 뒤에는 0.5 로 */
      else c.expr += '.';
      c.fresh = false;
    } else {
      var seg = c.expr.split(/[+\-\u2212×÷]/).pop();
      if (seg.replace(/[^0-9]/g, '').length + k.length > 12) return;   /* 한 숫자 12자리(조) 까지 */
      if (c.fresh) { c.expr = k; c.fresh = false; }
      else c.expr = (c.expr + k).replace(/^0+(?=\d)/, '');
    }
    calcSync();
  }
  /* 저장 시 계산식이 잘못됐으면 저장을 막는다 */
  function calcInvalid() { return !!(st.calc && st.calc.open && st.calc.invalid); }

  /* ---------------- 입력 시트 ---------------- */
  function openInput(prefill) {
    st.calc = null;
    calcPrev = null;
    var t = today();
    st.input = {
      type: (prefill && prefill.type) || 'expense',
      amount: '',
      date: (prefill && prefill.date) || t,
      catId: null,
      method: (prefill && prefill.method) || 'credit',
      cardId: (prefill && prefill.cardId) || (db.cards[0] || {}).id || null,
      memo: '',
      months: (prefill && prefill.months) || 1,
      editId: null
    };
    if (prefill && prefill.tx) {
      var tx = prefill.tx;
      st.input = {
        type: tx.type, amount: String(tx.amount), date: tx.date, catId: tx.catId,
        method: tx.method, cardId: tx.cardId, memo: tx.memo || '',
        months: tx.installment && tx.installment.months ? tx.installment.months : 1,
        instDays: (tx.installment && tx.installment.days) || null,
        origMonths: tx.installment && tx.installment.months ? tx.installment.months : 1,
        editId: tx.id
      };
    }
    if (!st.input.catId) {
      var list = db.categories[st.input.type] || [];
      st.input.catId = list.length ? list[0].id : null;
    }
    renderInput();
  }

        });

      }
      h += '</div>';

      h += '<div class="field"><div class="lb">할부</div><div class="line" style="padding:8px 12px">' +
        '<select id="f-inst" onchange="App.setInputMonths(this.value)">' +

      }

    h += '<div class="field"><div class="lb">메모</div><div class="line">' +

  }

  function deleteCatInternal(type, id) {
    var list = db.categories[type] || [];
    if (list.length <= 1) { toast('항목이 하나는 있어야 해요'); return false; }
    var target = list.filter(function (c) { return c.id === id; })[0];
    if (!target) return false;
    var used = (db.transactions || []).some(function (t) { return t.type === type && t.catId === id; }) ||
      (db.subscriptions || []).some(function (s) { return s.type === type && s.catId === id; });
    var other = list.filter(function (c) { return c.id !== id; })[0];
    if (used) {
      if (!confirm('이 항목을 쓴 기록이 있어요. 그 기록들을 ‘' + other.name + '’으로 옮기고 삭제할까요?')) return false;
      db.transactions.forEach(function (t) { if (t.type === type && t.catId === id) t.catId = other.id; });
      (db.subscriptions || []).forEach(function (s) { if (s.type === type && s.catId === id) s.catId = other.id; });
    } else {
      if (!confirm('이 항목을 삭제할까요?')) return false;
    }
    db.categories[type] = list.filter(function (c) { return c.id !== id; });
    save();
    return true;
  }

  /* ---------------- 모달 ---------------- */
  /* iOS Safari: 키보드가 올라와도 뒷배경·시트가 밀리지 않도록 body를 fixed로 고정 */
  var lockY = 0, lockScr = 0;
  function lockPage() {
    var scr = document.getElementById('scr');
    lockScr = scr ? scr.scrollTop : 0;
    lockY = window.scrollY || window.pageYOffset || 0;
    var b = document.body.style;
    b.position = 'fixed'; b.top = (-lockY) + 'px'; b.left = '0'; b.right = '0'; b.width = '100%';
    b.overflow = 'hidden';
    document.documentElement.classList.add('modal-open');
    document.body.classList.add('modal-open');
  }
  function unlockPage() {
    var b = document.body.style;
    b.position = ''; b.top = ''; b.left = ''; b.right = ''; b.width = ''; b.overflow = '';
    document.documentElement.classList.remove('modal-open');
    document.body.classList.remove('modal-open');
    window.scrollTo(0, lockY || 0);
    var scr = document.getElementById('scr');
    if (scr) scr.scrollTop = lockScr || 0;
    st._scroll = lockScr || 0;
  }
  function hideModal() {
    var m = document.getElementById('modal');
    if (!m) return false;
    st.calc = null;
    calcPrev = null;
    var wasOpen = !m.classList.contains('hidden');
    m.classList.add('hidden');
    m.innerHTML = '';
    st.sheet = null;
    if (wasOpen) unlockPage();
    else { document.documentElement.classList.remove('modal-open'); document.body.classList.remove('modal-open'); }
    return wasOpen;
  }
  function showModal(html, isDialog) {
    var m = document.getElementById('modal');
    if (!m) return;
    var wasOpen = !m.classList.contains('hidden');
    var prevBody = m.querySelector('.sh-body');
    var prevTop = prevBody ? prevBody.scrollTop : 0;
    m.innerHTML = '<div class="bg" onclick="App.closeModal()"></div>' + html;
    m.classList.remove('hidden');
    var nextBody = m.querySelector('.sh-body');
    if (nextBody && prevBody) nextBody.scrollTop = prevTop;
    /* 같은 시트를 다시 그릴 때는 올라오는 애니메이션을 생략(화면 흔들림 방지) */
    if (wasOpen) { var sh = m.querySelector('.sheet'); if (sh) sh.style.animation = 'none'; }
    else lockPage();
  }
  function closeModal() {
    hideModal();
    if (location.hash === '#input') history.replaceState(null, '', '#' + st.route);
  }

  function toast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('on');
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { t.classList.remove('on'); }, 1700);
  }

    onAmount: function (el) {
      /* 쉼표만 바꾸고 커서 위치는 그대로 (입력 중 화면·커서 튀는 현상 방지) */
      var raw = el.value.replace(/[^\d]/g, '');
      var next = raw ? Number(raw).toLocaleString('ko-KR') : '';
      if (next === el.value) return;
      var pos = el.selectionStart;
      var digitsBefore = pos == null ? null : el.value.slice(0, pos).replace(/[^\d]/g, '').length;
      el.value = next;
      if (digitsBefore !== null) {
        var i = 0, c = 0;
        while (i < next.length && c < digitsBefore) {
          var ch = next.charAt(i);
          if (ch >= '0' && ch <= '9') c++;
          i++;
        }
        try { el.setSelectionRange(i, i); } catch (e) { }
      }

    saveTx: function () {

      var amount = num(f.amount);

      if (!f.catId) { toast('항목을 선택해 주세요'); return; }
      if (f.type === 'expense' && f.method === 'credit' && !f.cardId) { toast('카드를 선택해 주세요'); return; }
      var tx = {
        id: f.editId || nid('t'), date: f.date, type: f.type, amount: amount, catId: f.catId,

        cardId: f.type === 'expense' && f.method === 'credit' ? f.cardId : null,
        memo: f.memo || ''

        tx.installment = { months: f.months };
        /* 회차별 실제 결제일은 개월 수를 그대로 둔 경우에만 유지 */
        if (f.instDays && f.origMonths === f.months) tx.installment.days = f.instDays;
      }
      var idx = -1;
      db.transactions.forEach(function (x, i) { if (x.id === tx.id) idx = i; });

      st.selDay = tx.date;

      var em = s && s.emoji ? s.emoji : '';
      var inPreset = CAT_EMOJIS.some(function (r) { return r[0] === em; });
      var h = '<div class="sheet"><div class="sh-head"><button class="xbtn" onclick="App.closeModal()">✕</button>' +
        '<div class="ttl">' + (s ? '정기 항목 수정' : '정기 지출/수입') + '</div><span style="width:28px"></span></div><div class="sh-body">';
      h += '<div class="pill" style="margin-bottom:12px">' +
        '<button id="sub-exp" class="' + (type !== 'income' ? 'on e' : '') + '" onclick="App.subType(\'expense\')">지출</button>' +
        '<button id="sub-inc" class="' + (type === 'income' ? 'on i' : '') + '" onclick="App.subType(\'income\')">수입</button></div>';
      h += '<input type="hidden" id="sub-type" value="' + type + '">';
      h += '<div class="field" style="margin-top:0"><div class="lb">이름</div><div class="line">' +
        '<input type="text" id="sub-name" placeholder="예: 넷플릭스, 월세, 급여" value="' + esc(s ? s.name : '') + '" oninput="App.onSubName(this)"></div></div>';
      h += '<div class="field"><div class="lb">금액</div><div class="line">' +
        '<input id="sub-amount" inputmode="numeric" placeholder="0" value="' + (s ? fmt(s.amount) : '') + '" oninput="App.onAmount(this)"><span class="muted">원</span>' + calcBtnHtml('sub-amount') + '</div></div>';
      h += '<div class="field"><div class="lb">매월 언제</div><div class="line" style="gap:6px">' +
        '<input type="number" id="sub-day" min="1" max="31" value="' + (s && s.day !== 'end' ? s.day : 5) + '" style="width:60px;text-align:center">' +
        '<span class="muted">일</span>' +
        '<label style="display:flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;color:#5C646E;margin-left:auto"><input type="checkbox" id="sub-last"' + (s && s.day === 'end' ? ' checked' : '') + '>말일</label></div></div>';
      h += '<div class="field"><div class="lb">결제수단</div><div class="seg">' +
        ['account', 'debit', 'credit'].map(function (mm) {
          return '<button class="' + ((s ? s.method : 'account') === mm ? 'on' : '') + '" onclick="App.subMethod(\'' + mm + '\')">' + methodName(mm) + '</button>';
        }).join('') + '</div><input type="hidden" id="sub-method" value="' + (s ? s.method : 'account') + '">';
      h += '<div class="cardchips" id="sub-cards" style="' + ((s ? s.method : '') === 'credit' ? '' : 'display:none') + '">';
      (db.cards || []).forEach(function (c) {
        h += '<button class="' + (s && s.cardId === c.id ? 'on' : '') + '" onclick="App.subCard(\'' + c.id + '\')"><i style="background:' + c.color + '"></i>' + esc(c.name) + '</button>';
      });
      h += '</div><input type="hidden" id="sub-card" value="' + (s ? s.cardId || '' : '') + '"></div>';
      h += '<div class="field"><div class="lb">항목</div><div class="catsc" id="sub-cats">' + catButtons(type, catId) + '</div>' +
        '<input type="hidden" id="sub-cat" value="' + (catId || '') + '"></div>';
      h += '<div class="field"><div class="lb">아이콘 (이모지)</div>' +
        '<div class="catprev"><span class="ic" id="sub-prev-ic">' + esc(em || catEmoji(type, catId)) + '</span>' +
        '<div class="txt"><div class="nm" id="sub-prev-nm">' + esc(s && s.name ? s.name : '정기 항목') + '</div>' +
        '<div class="sb">목록·달력·통계에 이 아이콘으로 표시</div></div>' +
        '<button class="act" onclick="App.toggleSubEmojiPick()">아이콘 고르기</button></div>' +
        '<div id="sub-empick" class="hidden" style="margin-top:8px">' +
        '<div class="empick" id="sub-emojis">' + CAT_EMOJIS.map(function (r, i) {
          return '<button type="button" class="' + (em === r[0] ? 'on' : '') + '" aria-label="' + r[1] + '" title="' + r[1] + '" onclick="App.pickSubEmoji(' + i + ')">' + r[0] + '</button>';
        }).join('') + '</div>' +
        '<div class="line" style="margin-top:8px"><input type="text" id="sub-emoji" maxlength="16" placeholder="직접 입력 (이모지 붙여넣기)" value="' + esc(inPreset ? '' : em) + '" oninput="App.onSubEmoji(this)"><span class="muted" style="flex:0 0 auto;white-space:nowrap;margin-left:6px">이모지</span></div>' +
        '<div class="hint">위 목록에서 고르거나, 없는 이모지는 직접 입력 칸에 넣으면 돼요. 비워 두면 항목 아이콘을 그대로 써요.' +
        '<br><button class="act" style="margin-top:6px" onclick="App.clearSubEmoji()">항목 아이콘 쓰기</button></div>' +
        '</div>' +
        '<input type="hidden" id="sub-emoji-cur" value="' + esc(em) + '"></div>';
      h += '<div class="field"><div class="lb">시작 월</div><div class="line"><input type="month" id="sub-start" value="' + (s ? String(s.startMonth || '').slice(0, 7) : CORE.ymOf(today())) + '"></div></div>';
      h += '<div class="field"><div class="lb">종료 월 (해지하면 비워 두세요)</div><div class="line"><input type="month" id="sub-end" value="' + (s && s.endMonth ? String(s.endMonth).slice(0, 7) : '') + '"></div></div>';
      h += '</div><div class="sh-foot">' +
        (s ? '<div class="btnrow"><button class="btn danger" onclick="App.deleteSub(\'' + s.id + '\')">삭제</button><button class="btn" onclick="App.saveSub(\'' + s.id + '\')">저장</button></div>'
          : '<button class="btn" onclick="App.saveSub()">추가하기</button>') + '</div></div>';
      showModal(h);
      calcMount();
      var sel = document.querySelector('#sub-cats .cat.on');
      if (sel) { try { sel.scrollIntoView({ block: 'nearest', inline: 'center' }); } catch (e) { } }
    },
    onSubName: function (el) {
      var nm = document.getElementById('sub-prev-nm');
      if (nm) nm.textContent = String(el.value || '').trim() || '정기 항목';
    },
    subType: function (t) {
      document.getElementById('sub-type').value = t;
      document.getElementById('sub-exp').className = t === 'expense' ? 'on e' : '';
      document.getElementById('sub-inc').className = t === 'income' ? 'on i' : '';
      var list = db.categories[t] || [];
      var cur = document.getElementById('sub-cat').value;
      var ok = list.filter(function (c) { return c.id === cur; })[0] ? cur : ((list[0] || {}).id || '');
      document.getElementById('sub-cat').value = ok;
      document.getElementById('sub-cats').innerHTML = catButtons(t, ok);
      syncSubPreview();
    },
    subCat: function (id) {
      document.getElementById('sub-cat').value = id;
      var type = document.getElementById('sub-type').value;
      var list = db.categories[type] || [];
      Array.prototype.forEach.call(document.querySelectorAll('#sub-cats .cat'), function (b, i) {
        b.classList.toggle('on', !!(list[i] && list[i].id === id));
      });
      syncSubPreview();
    },
    toggleSubEmojiPick: function () {
      var box = document.getElementById('sub-empick');
      if (box) box.classList.toggle('hidden');
    },
    pickSubEmoji: function (i) {
      var r = CAT_EMOJIS[i];
      if (!r) return;
      var el = document.getElementById('sub-emoji');
      if (el) el.value = '';
      setSubEmoji(r[0]);
    },
    onSubEmoji: function (el) {
      var g = firstIcon(el.value);
      if (el.value && el.value !== g) el.value = g;
      setSubEmoji(g);
    },
    clearSubEmoji: function () {
      var el = document.getElementById('sub-emoji');
      if (el) el.value = '';
      setSubEmoji('');
    },
    subMethod: function (m) {
      document.getElementById('sub-method').value = m;
      document.getElementById('sub-cards').style.display = m === 'credit' ? '' : 'none';
      Array.prototype.forEach.call(document.querySelectorAll('.seg button'), function (b) {
        if (b.textContent === methodName(m)) b.classList.add('on'); else b.classList.remove('on');
      });
    },
    subCard: function (id) {
      document.getElementById('sub-card').value = id;
      Array.prototype.forEach.call(document.querySelectorAll('#sub-cards button'), function (b) {
        b.classList.toggle('on', b.textContent.indexOf((cardById(id) || {}).name) >= 0);
      });
    },
    saveSub: function (id) {
      var name = document.getElementById('sub-name').value.trim();
      if (calcInvalid()) { toast('계산식을 확인해 주세요'); return; }
      var amount = num(document.getElementById('sub-amount').value);
      var isLast = document.getElementById('sub-last').checked;
      var day = isLast ? 'end' : Number(document.getElementById('sub-day').value) || 1;
      var method = document.getElementById('sub-method').value;
      var cardId = document.getElementById('sub-card').value || null;
      var catId = document.getElementById('sub-cat').value || null;
      var em = firstIcon((document.getElementById('sub-emoji-cur') || {}).value || '');
      var startMonth = document.getElementById('sub-start').value || CORE.ymOf(today());
      var endMonth = document.getElementById('sub-end').value || null;
      if (!name) { toast('이름을 입력해 주세요'); return; }
      if (!amount) { toast('금액을 입력해 주세요'); return; }
      if (amount < 0) { toast('금액은 0원보다 커야 해요'); return; }
      if (day !== 'end' && (day < 1 || day > 31)) { toast('날짜는 1~31일 사이로'); return; }
      if (method === 'credit' && !cardId) { toast('카드를 선택해 주세요'); return; }
      var prev = id ? (db.subscriptions.filter(function (x) { return x.id === id; })[0] || {}) : {};
      var s = {
        id: id || nid('s'), name: name, amount: amount,
        type: document.getElementById('sub-type').value,
        catId: catId,
        emoji: em || '',
        method: method, cardId: method === 'credit' ? cardId : null,
        day: day, startMonth: startMonth, endMonth: endMonth,
        memo: prev.memo || '',
        active: prev.active !== false
      };
      if (!s.catId) {
        var list = db.categories[s.type === 'income' ? 'income' : 'expense'];
        s.catId = (list[0] || {}).id || null;
      }
      var idx = -1;
      db.subscriptions.forEach(function (x, i) { if (x.id === s.id) idx = i; });
      if (idx >= 0) db.subscriptions[idx] = s; else db.subscriptions.push(s);
      save(); closeModal(); render(); toast(idx >= 0 ? '수정했어요' : '정기 항목을 추가했어요');
    },
    deleteSub: function (id) {
      if (!confirm('이 정기 항목을 삭제할까요?\n(잠시 멈추려면 토글을 꺼 두세요)')) return;
      db.subscriptions = db.subscriptions.filter(function (s) { return s.id !== id; });
      save(); closeModal(); render(); toast('삭제했어요');
    },
    toggleSub: function (id) {
      db.subscriptions.forEach(function (s) { if (s.id === id) s.active = s.active === false; });
      save(); render();
    },

    /* 설정 */
    toggleCarry: function () {
      db.settings.carryOver = db.settings.carryOver === false;
      save(); render(); toast(db.settings.carryOver ? '이월 잔액을 포함할게요' : '이월 잔액을 빼고 볼게요');
    },
    toggleSubReserve: function () {
      db.settings.subReserve = db.settings.subReserve === false;
      save(); render();
      toast(db.settings.subReserve === false
        ? '다음 달 구독은 빼지 않은 잔액으로 보여줄게요'
        : '다음 달 구독을 미리 뺀 잔액으로 보여줄게요');
    },
    saveStartBalance: function (el) {
      db.settings.startBalance = num(el.value);
      if (!CORE.ymOf(db.settings.startMonth || '')) db.settings.startMonth = CORE.ymOf(today());
      save(); render(); toast('시작 잔액을 저장했어요');
    },
    /* 색상 테마 접기/펼치기 */
    toggleTheme: function (force) {
      var open = typeof force === 'boolean' ? force : !st.themeOpen;
      st.themeOpen = open;
      themeAccordion(open, true);
    },
    /* 색상 테마 — 칩은 바로 저장, 컬러 피커는 움직이는 동안 미리보기만 */
    setThemeColor: function (key, hex, saveNow) {
      hex = CORE.normHex(hex);
      if (CORE.THEME_KEYS.indexOf(key) < 0 || !hex) return;
      var c = themeColors();
      c[key] = hex;
      db.settings = db.settings || {};
      db.settings.colors = c;
      applyTheme();
      if (saveNow !== false) save();
      syncThemeUI(key, hex);
    },
    resetThemeKey: function (key) {
      if (CORE.THEME_KEYS.indexOf(key) < 0) return;
      api.setThemeColor(key, CORE.THEME_DEFAULTS[key]);
      toast('기본 색으로 되돌렸어요');
    },
    resetTheme: function () {
      if (db.settings) delete db.settings.colors;
      applyTheme(); save(); render();
      toast('기본 색상으로 초기화했어요');
    },

    /* 백업 */
    exportJSON: function () {
      var blob = new Blob([JSON.stringify(db, null, 2)], { type: 'application/json' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'budget-backup-' + today() + '.json';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
      toast('백업 파일을 내려받았어요');
    },
    importJSON: function (input) {
      var f = input.files && input.files[0];
      if (!f) return;
      var r = new FileReader();
      r.onload = function () {
        try {
          var d = JSON.parse(r.result);
          if (!d || !d.transactions) throw new Error('invalid');
          db = normalize(d);
          save(); render(); toast('백업을 불러왔어요');
        } catch (e) { toast('이 파일은 읽을 수 없어요'); }
      };
      r.readAsText(f);
    },
    reseed: function () {
      if (!confirm('지금 기록을 모두 지우고 데모 데이터로 채울까요?')) return;
      db = seed(); save(); render(); toast('데모 데이터를 채웠어요');
    },
    clearAll: function () {
      if (!confirm('모든 기록을 지우고 빈 가계부로 시작할까요?')) return;
      reset();
    },
    closeModal: closeModal,
    toast: toast
  };

  function syncInput() {
    var el = document.getElementById('f-amount');
    if (!el) return;
    st.input.amount = el.value;
    var d = document.getElementById('f-date');
    if (d) st.input.date = d.value || st.input.date;
    var mm = document.getElementById('f-memo');
    if (mm) st.input.memo = mm.value;
    var ins = document.getElementById('f-inst');
    if (ins) st.input.months = Number(ins.value) || 1;
  }

  /* ---------------- 시작 ---------------- */
  var booted = false;
  function boot() {
    if (booted) return;
    booted = true;
    db = load();
    st.ym = CORE.ymOf(today());
    var hash = (location.hash || '').replace('#', '');
    if (hash === 'list') { hash = 'stats'; history.replaceState(null, '', '#stats'); }   /* 옛 탭 이름 호환 */
    if (['calendar', 'stats', 'budget', 'settings'].indexOf(hash) >= 0) st.route = hash;
    render();
    if (hash === 'input') { api.goto('calendar'); openInput(); }
    /* 첫 방문이면 안내 */
    if (!localStorage.getItem(LS + '-seen')) {
      localStorage.setItem(LS + '-seen', '1');
      setTimeout(function () { toast('데모 데이터로 시작했어요 · 설정에서 비울 수 있어요'); }, 500);
    }
  }

  api.boot = boot;
  api._db = function () { return db; };
  api._state = st;

  window.addEventListener('hashchange', function () {
    var h = (location.hash || '').replace('#', '');
    if (h === 'input') { if (!st.input) openInput(); return; }
    if (h === 'list') { h = 'stats'; history.replaceState(null, '', '#stats'); }
    if (['calendar', 'stats', 'budget', 'settings'].indexOf(h) >= 0) {
      if (h !== st.route) { st.route = h; st._scroll = 0; }
      hideModal();
      render();
    }
  });
  return api;
})();

document.addEventListener('DOMContentLoaded', function () {
  App.boot();
});
if (document.readyState === 'complete' || document.readyState === 'interactive') { try { App.boot(); } catch (e) { } }
</script>
</body>
</html>
