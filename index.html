<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>가계부</title>

<!-- ===== PWA / 홈 화면에 추가 (iOS Safari) ===== -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="가계부">
<meta name="theme-color" content="#0FB9A5">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='42' fill='%230FB9A5'/%3E%3Ctext x='90' y='122' font-size='96' font-family='-apple-system,sans-serif' font-weight='700' text-anchor='middle' fill='white'%3E%E2%82%A9%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='42' fill='%230FB9A5'/%3E%3Ctext x='90' y='122' font-size='96' font-family='-apple-system,sans-serif' font-weight='700' text-anchor='middle' fill='white'%3E%E2%82%A9%3C/text%3E%3C/svg%3E">

<style>
:root{
  --bg:#F4F5F7; --card:#FFFFFF; --ink:#1A1D21; --sub:#8B929C; --line:#EDEFF2;
  --mint:#0FB9A5; --mint-d:#0AA391; --mint-soft:#E7F7F4;
  --ex:#F2545B; --ex-soft:#FDEDEE; --inc:#2E8BF0; --inc-soft:#EAF2FE;
  --violet:#7C6CF5;
  --r:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  background:#E9EBEF;color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
#phone{
  position:relative;width:100%;max-width:430px;margin:0 auto;height:100dvh;
  background:var(--bg);display:flex;flex-direction:column;overflow:hidden;
  box-shadow:0 0 60px rgba(20,30,40,.12);
}
#scr{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:18px}
.hidden{display:none!important}

/* ---------- 공통 ---------- */
.vhead{
  position:sticky;top:0;z-index:20;background:rgba(244,245,247,.94);
  backdrop-filter:saturate(180%) blur(12px);
  padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 8px;
  display:flex;align-items:center;justify-content:space-between;gap:8px;
}
.vhead .ttl{font-size:19px;font-weight:800;letter-spacing:-.4px}
.mnav{display:flex;align-items:center;gap:2px;flex:0 0 auto}
.mnav button{width:30px;height:30px;border:0;background:transparent;border-radius:9px;display:grid;place-items:center;color:#6C747E}
.mnav .ym{font-size:16.5px;font-weight:800;letter-spacing:-.3px;min-width:104px;text-align:center}
.ghost{border:1px solid var(--line);background:#fff;color:#5C646E;font-size:11.5px;font-weight:700;padding:6px 9px;border-radius:10px}
.wrap{padding:0 14px}
.card{background:var(--card);border-radius:var(--r);padding:14px;margin:10px 0}
.sect-h{display:flex;align-items:baseline;justify-content:space-between;margin:13px 4px 6px}
.sect-h b{font-size:13.5px;font-weight:800;letter-spacing:-.2px}
.sect-h .l{font-size:11px;color:var(--sub);font-weight:600}
.muted{color:var(--sub);font-weight:600;font-size:11px}
.ex{color:var(--ex)}.inc{color:var(--inc)}

/* ---------- 잔액 카드 ---------- */
.bal{
  border-radius:20px;padding:15px 16px 13px;color:#fff;
  background:linear-gradient(135deg,#14CBB1 0%,#0AA391 100%);
  box-shadow:0 8px 22px rgba(10,163,145,.24);
}
.bal .t{font-size:11.5px;font-weight:700;opacity:.85;letter-spacing:-.1px}
.bal .v{font-size:27px;font-weight:800;letter-spacing:-1px;margin:2px 0 10px;line-height:1.15}
.bal .v small{font-size:15px;font-weight:700;margin-left:2px;opacity:.9}
.bal .r{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;border-top:1px solid rgba(255,255,255,.22);padding-top:9px}
.bal .r>div{display:flex;flex-direction:column;gap:2px}
.bal .r span{font-size:10.5px;opacity:.8;font-weight:600}
.bal .r b{font-size:12.5px;font-weight:800;letter-spacing:-.2px}

/* ---------- 카드 사용액 ---------- */
.cardstrip{display:flex;gap:7px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.cardstrip::-webkit-scrollbar{display:none}
.ctile{flex:1 0 0;min-width:100px;background:#fff;border-radius:14px;padding:10px 11px 9px}
.ct-top{display:flex;align-items:center;gap:5px;font-size:10.5px;color:#6C747E;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ct-top i{width:7px;height:7px;border-radius:50%;flex:0 0 auto}
.ct-amt{font-size:14px;font-weight:800;letter-spacing:-.4px;margin-top:4px}
.ct-bar{height:3px;border-radius:3px;background:#F0F2F5;margin-top:7px;overflow:hidden}
.ct-bar i{display:block;height:100%;border-radius:3px}
.ctile.empty{display:flex;align-items:center;justify-content:center;color:#A3AAB3;font-size:11.5px;font-weight:700;text-align:center}

/* ---------- 달력 ---------- */
.cal{background:#fff;border-radius:var(--r);padding:8px 8px 6px}
.wd{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:2px}
.wd span{text-align:center;font-size:10.5px;font-weight:700;color:#9AA1AA;padding:3px 0}
.wd span:first-child{color:#E8656E}.wd span:last-child{color:#4C8DF0}
.calleg{display:flex;justify-content:flex-end;align-items:center;gap:9px;padding:1px 3px 2px;font-size:9.5px;font-weight:700;color:#9AA1AA;letter-spacing:-.2px}
.calleg span{display:inline-flex;align-items:center;gap:3px}
.calleg i{width:5px;height:5px;border-radius:50%;display:block}
.calleg i.i{background:var(--inc)}.calleg i.c{background:var(--ex)}.calleg i.v{background:#7B3FE4}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px}
.cell{
  height:60px;border:0;background:transparent;border-radius:11px;padding:3px 0 2px;
  display:flex;flex-direction:column;align-items:center;gap:0;cursor:pointer;overflow:hidden;
}
.cell .dn{font-size:11.5px;font-weight:700;color:#3A4048;width:19px;height:19px;line-height:19px;text-align:center;border-radius:50%;font-style:normal;margin-bottom:1px;flex:0 0 auto}
.cell.sun .dn{color:#E8656E}.cell.sat .dn{color:#4C8DF0}
.cell.today .dn{background:var(--mint);color:#fff}
.cell.sel{background:#EAF7F4}
.cell .am{
  font-size:9.5px;line-height:11px;font-weight:700;letter-spacing:-.4px;font-style:normal;
  font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;
  max-width:100%;white-space:nowrap;padding:0 1px;
}
.cell .am.long{font-size:8.8px;letter-spacing:-.5px}
.cell .am.i{color:var(--inc)}
.cell .am.c{color:var(--ex)}
.cell .am.v{color:#7B3FE4}
.cell.out{opacity:.32}
.cell .fx{font-size:8px;color:var(--violet);line-height:8px}

/* ---------- 예산 ---------- */
.bmini{background:#fff;border-radius:var(--r);padding:13px 14px;margin:10px 0}
.bmini .top{display:flex;justify-content:space-between;align-items:center}
.bmini .nm{font-size:12.5px;font-weight:800;letter-spacing:-.2px}
.bmini .pr{font-size:11px;color:var(--sub);font-weight:600}
.bar{height:8px;border-radius:6px;background:#EEF1F4;overflow:hidden;margin:9px 0 7px}
.bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,#16D0B6,#0AA391);transition:width .3s}
.bar i.warn{background:linear-gradient(90deg,#FFB020,#F5893A)}
.bar i.over{background:linear-gradient(90deg,#FF7A7F,#F2545B)}
.bmini .bot{display:flex;justify-content:space-between;font-size:11.5px;font-weight:700}
.bmini .bot .k{color:var(--sub);font-weight:600;margin-right:4px}

/* ---------- 예산 탭 ---------- */
.bbig{border-radius:20px;padding:16px;background:#fff;box-shadow:0 4px 14px rgba(25,35,45,.05)}
.bbig .lbl{font-size:12px;font-weight:800;color:var(--mint-d);letter-spacing:-.2px}
.bbig .per{font-size:11.5px;color:var(--sub);font-weight:600;margin-top:2px}
.bbig .rem{font-size:28px;font-weight:800;letter-spacing:-1px;margin:10px 0 2px}
.bbig .rem small{font-size:14px;font-weight:700;margin-left:2px}
.bbig .sub2{font-size:11.5px;color:var(--sub);font-weight:600}
.bbig .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.kbox{background:#F7F8FA;border-radius:12px;padding:9px 10px}
.kbox .k{font-size:10.5px;color:var(--sub);font-weight:700;margin-bottom:3px}
.kbox .v{font-size:14px;font-weight:800;letter-spacing:-.4px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:12px 14px 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:#fff;color:#666E78;font-size:11.5px;font-weight:700;padding:7px 11px;border-radius:999px}
.chip.on{background:#0FB9A5;border-color:#0FB9A5;color:#fff}
.daily{background:var(--mint-soft);border-radius:14px;padding:11px 13px;display:flex;justify-content:space-between;align-items:center;margin-top:10px}
.daily .k{font-size:11.5px;font-weight:700;color:#0A8A7A}
.daily b{font-size:17px;font-weight:800;letter-spacing:-.4px;color:#0A8A7A}

/* ---------- 내역 목록 ---------- */
.daygroup{margin:12px 0 0}
.daygroup .dh{display:flex;justify-content:space-between;align-items:center;padding:0 6px 6px;font-size:11.5px;color:var(--sub);font-weight:700}
.daygroup .dh b{color:#3A4048;font-size:12.5px;font-weight:800;margin-right:5px}
.items{background:#fff;border-radius:16px;overflow:hidden}
.item{display:flex;align-items:center;gap:10px;padding:11px 12px;border-bottom:1px solid #F5F6F8;width:100%;border:0;background:#fff;text-align:left;cursor:pointer}
.item:last-child{border-bottom:0}
.item .ic{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font-size:15px;flex:0 0 auto;background:#F4F6F8}
.item .mid{flex:1;min-width:0;display:block}
.item .nm{display:block;font-size:13px;font-weight:700;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .meta{display:block;font-size:10.5px;color:var(--sub);font-weight:600;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .amt{font-size:13.5px;font-weight:800;letter-spacing:-.4px;text-align:right;flex:0 0 auto}
.tag{display:inline-block;font-size:9.5px;font-weight:800;padding:1px 5px;border-radius:5px;margin-left:4px;vertical-align:1px}
.tag.inst{background:#F0EDFF;color:#6A57E8}
.tag.fix{background:var(--mint-soft);color:#0A8A7A}
.empty{text-align:center;color:var(--sub);font-size:12.5px;font-weight:600;padding:34px 10px}

/* ---------- 탭바 ---------- */
#tabs{
  display:flex;align-items:flex-end;justify-content:space-around;
  height:calc(62px + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);
  background:rgba(255,255,255,.97);border-top:1px solid var(--line);
  backdrop-filter:blur(12px);position:relative;z-index:30;
}
#tabs button{flex:1;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 8px;color:#A3AAB3;font-size:10px;font-weight:700;letter-spacing:-.2px}
#tabs button.on{color:var(--mint-d)}
#tabs #fab:active{transform:scale(.94)}
#tabs button svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
#fabwrap{flex:0 0 66px;display:flex;justify-content:center}
#tabs #fab{width:50px;height:50px;border-radius:50%;background:linear-gradient(135deg,#16D0B6,#0AA391);color:#fff;font-size:26px;font-weight:400;display:grid;place-items:center;box-shadow:0 6px 16px rgba(10,163,145,.36);margin-bottom:11px;position:relative;top:0;padding:0;border:0;flex:0 0 50px}

/* ---------- 모달 ---------- */
.modal{position:fixed;inset:0;z-index:100;display:flex}
.modal .bg{position:absolute;inset:0;background:rgba(16,22,28,.42);animation:fade .18s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{
  position:relative;margin-top:auto;width:100%;max-width:430px;max-height:94dvh;background:#fff;
  border-radius:22px 22px 0 0;display:flex;flex-direction:column;overflow:hidden;
  animation:up .24s cubic-bezier(.2,.9,.3,1);margin-left:auto;margin-right:auto;
}
@keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
.dialog{
  position:relative;margin:auto;width:calc(100% - 44px);max-width:360px;background:#fff;border-radius:20px;
  padding:18px;animation:zoom .18s ease;
}
@keyframes zoom{from{transform:scale(.94);opacity:.6}to{transform:scale(1);opacity:1}}
.sh-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px;border-bottom:1px solid var(--line);flex:0 0 auto}
.sh-head .ttl{font-size:15.5px;font-weight:800;letter-spacing:-.4px}
.sh-body{overflow-y:auto;padding:14px 16px 8px;flex:1}
.sh-foot{flex:0 0 auto;padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:#fff}
.xbtn{width:28px;height:28px;border-radius:50%;border:0;background:#F2F4F6;color:#6C747E;font-size:15px;display:grid;place-items:center}
.pill{display:flex;background:#F2F4F6;border-radius:12px;padding:3px;gap:3px}
.pill button{flex:1;border:0;background:transparent;border-radius:9px;padding:8px 0;font-size:12.5px;font-weight:800;color:#7C848E}
.pill button.on{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(20,30,40,.1)}
.pill button.on.e{color:var(--ex)}.pill button.on.i{color:var(--inc)}

.amountbox{display:flex;align-items:baseline;justify-content:flex-end;gap:4px;padding:2px 2px 9px;border-bottom:2px solid var(--ink)}
.amountbox input{border:0;outline:0;text-align:right;font-size:28px;font-weight:800;letter-spacing:-1.2px;width:100%;background:transparent;min-width:0}
.amountbox input::placeholder{color:#D3D8DE}
.amountbox span{font-size:15px;font-weight:700;color:#9AA1AA}
.field{margin-top:11px}
.field .lb{font-size:11.5px;font-weight:800;color:#6C747E;margin-bottom:6px;letter-spacing:-.2px}
.line{display:flex;align-items:center;justify-content:space-between;gap:8px;background:#F7F8FA;border-radius:12px;padding:11px 12px}
.line input[type=date],.line input[type=text],.line input[type=number],.line select{
  border:0;background:transparent;outline:0;font-size:13.5px;font-weight:700;width:100%;-webkit-appearance:none;appearance:none
}
.line input{outline:0;border:0;background:transparent;font-size:13.5px;font-weight:700}
.line input:focus{outline:0}
.dateline{position:relative;cursor:pointer}
.dateline .dlabel{font-size:13.5px;font-weight:700;flex:1}
.dateline .dateov{position:absolute;inset:0;width:100%;height:100%;opacity:0;border:0;padding:0;margin:0}
.dateline .calico{width:17px;height:17px;stroke:#8B929C;fill:none;stroke-width:1.7;pointer-events:none}
.line select{background:transparent}
.catgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.cat{border:1px solid var(--line);background:#fff;border-radius:13px;padding:7px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:700;color:#5C646E}
.cat span{font-size:17px;line-height:19px}
.cat.on{border-color:var(--mint);background:var(--mint-soft);color:#0A8A7A}
.seg{display:flex;gap:6px}
.seg button{flex:1;border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 0;font-size:12px;font-weight:700;color:#6C747E}
.seg button.on{border-color:var(--mint);background:var(--mint-soft);color:#0A8A7A}
.cardchips{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.cardchips button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 11px;font-size:11.5px;font-weight:700;color:#5C646E;display:flex;align-items:center;gap:5px}
.cardchips button i{width:7px;height:7px;border-radius:50%;display:block}
.cardchips button.on{border-color:var(--mint);background:var(--mint-soft);color:#0A8A7A}
.hint{font-size:10.5px;color:var(--sub);font-weight:600;margin-top:6px;line-height:1.45}
.btn{border:0;border-radius:14px;padding:14px 0;width:100%;font-size:14.5px;font-weight:800;background:var(--mint);color:#fff;letter-spacing:-.3px}
.btn:active{background:var(--mint-d)}
.btn.sec{background:#F2F4F6;color:#5C646E}
.btn.danger{background:var(--ex-soft);color:var(--ex)}
.btnrow{display:flex;gap:8px}

/* ---------- 설정 ---------- */
.slist{background:#fff;border-radius:16px;overflow:hidden;margin:8px 0 0}
.srow{display:flex;align-items:center;gap:10px;padding:13px 14px;border-bottom:1px solid #F5F6F8}
.srow:last-child{border-bottom:0}
.srow .txt{flex:1;min-width:0}
.srow .t1{font-size:13px;font-weight:700;letter-spacing:-.2px}
.srow .t2{font-size:10.5px;color:var(--sub);font-weight:600;margin-top:2px}
.act{border:0;background:#F4F6F8;color:#5C646E;font-size:11px;font-weight:800;border-radius:9px;padding:6px 9px;white-space:nowrap;flex:0 0 auto}
.act.d{color:var(--ex);background:var(--ex-soft)}
.catrow{display:flex;align-items:center;gap:8px;padding:9px 2px;border-bottom:1px solid #F5F6F8}
.catrow:last-child{border-bottom:0}
.catrow .ic{width:30px;height:30px;border-radius:9px;background:#F4F6F8;display:grid;place-items:center;font-size:15px;flex:0 0 auto}
.catrow .nm{flex:1;min-width:0;font-size:13px;font-weight:700;letter-spacing:-.2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.catrow .nmbtn{flex:1;min-width:0;display:flex;align-items:center;gap:8px;border:0;background:transparent;padding:0;text-align:left;color:inherit;-webkit-tap-highlight-color:transparent}
.catrow .nmbtn:active{opacity:.55}
.addbtn{width:100%;border:1px dashed #CBD2DA;background:#fff;color:#5C646E;border-radius:12px;padding:11px 0;font-size:12.5px;font-weight:800}
.addbtn:active{background:#F7F8FA}
.catprev{display:flex;align-items:center;gap:11px;background:#F7F8FA;border-radius:14px;padding:11px 12px}
.catprev .ic{width:48px;height:48px;border-radius:14px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;font-size:25px;line-height:1;flex:0 0 auto}
.catprev .txt{flex:1;min-width:0}
.catprev .nm{font-size:14px;font-weight:800;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.catprev .sb{font-size:10.5px;color:var(--sub);font-weight:600;margin-top:2px}
.empick{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.empick button{height:42px;border:1px solid var(--line);background:#fff;border-radius:11px;padding:0;font-size:20px;line-height:1;display:grid;place-items:center;-webkit-tap-highlight-color:transparent}
.empick button:active{transform:scale(.94)}
.empick button.on{border-color:var(--mint);background:var(--mint-soft);box-shadow:inset 0 0 0 1px var(--mint)}
.mini{font-size:11px;color:var(--sub);font-weight:600;padding:2px 6px 0}
.switch{width:44px;height:26px;border-radius:99px;background:#DDE1E6;border:0;position:relative;transition:.18s;flex:0 0 auto}
.switch i{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.18s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch.on{background:var(--mint)}
.switch.on i{left:21px}
.addrow{display:flex;gap:7px;padding:10px 14px 13px}
.addrow input{flex:1;border:1px solid var(--line);border-radius:11px;padding:9px 11px;font-size:12.5px;font-weight:700;outline:0}
.addrow input:focus{border-color:var(--mint)}
.addrow button{border:0;background:var(--mint);color:#fff;border-radius:11px;padding:0 13px;font-size:12.5px;font-weight:800}

/* ---------- 토스트 ---------- */
#toast{
  position:fixed;left:50%;bottom:96px;transform:translate(-50%,14px);z-index:200;
  background:rgba(26,29,33,.92);color:#fff;font-size:12.5px;font-weight:700;
  padding:10px 16px;border-radius:12px;opacity:0;pointer-events:none;transition:.22s;white-space:nowrap;

<script>
/* ============================================================
   CORE — 순수 계산 로직 (DOM 의존 없음, 자동 테스트 대상)
   ============================================================ */
/* ===== CORE:START ===== */
var CORE = (function () {
  'use strict';

  var pad2 = function (n) { return (n < 10 ? '0' : '') + n; };

  function ymd(y, m, d) { return y + '-' + pad2(m) + '-' + pad2(d); }
  function parts(s) { var a = String(s).split('-').map(Number); return { y: a[0], m: a[1], d: a[2] }; }
  function ymOf(s) { return String(s).slice(0, 7); }
  function ymParts(ym) { var a = String(ym).split('-').map(Number); return { y: a[0], m: a[1] }; }
  function daysInMonth(y, m) { return new Date(y, m, 0).getDate(); } // m: 1~12
  function clampDay(y, m, day) {
    var dim = daysInMonth(y, m);
    var d = Math.floor(Number(day) || 1);
    if (d < 1) d = 1;
    if (d > dim) d = dim;
    return d;
  }
  function ymAdd(ym, n) {
    var p = ymParts(ym);
    var t = new Date(p.y, p.m - 1 + n, 1);
    return t.getFullYear() + '-' + pad2(t.getMonth() + 1);
  }
  function monthDiff(fromYm, toYm) {
    var a = ymParts(fromYm), b = ymParts(toYm);
    return (b.y - a.y) * 12 + (b.m - a.m);
  }
  function isYm(s) { return /^\d{4}-\d{2}$/.test(String(s)); }
  function cmpYm(a, b) { return a < b ? -1 : a > b ? 1 : 0; }
  function dayDiff(a, b) { // b - a (일)
    return Math.round((Date.parse(b + 'T00:00:00') - Date.parse(a + 'T00:00:00')) / 86400000);
  }
  function todayStr(d) {
    var t = d || new Date();
    return ymd(t.getFullYear(), t.getMonth() + 1, t.getDate());
  }

  /* ---- 할부: 원 단위 잔여분은 첫 회차에 몰아 반영 ---- */
  function normMonths(tx) {
    var n = tx && tx.installment && tx.installment.months ? Number(tx.installment.months) : 1;
    if (!isFinite(n) || n < 1) n = 1;
    if (n > 36) n = 36;
    return Math.floor(n);
  }
  function installmentParts(tx) {
    var n = normMonths(tx);
    var amount = Math.max(0, Math.round(Number(tx.amount) || 0));
    var base = Math.floor(amount / n);
    var rem = amount - base * n;
    var out = [];
    for (var i = 0; i < n; i++) out.push(base + (i === 0 ? rem : 0));
    return out;
  }
  // 특정 월(ym)에 이 거래가 반영되는 금액 (할부 회차 반영)
  function txAmountInMonth(tx, ym) {
    var n = normMonths(tx);
    var diff = monthDiff(ymOf(tx.date), ym);
    if (diff < 0) return 0;
    if (n === 1) return diff === 0 ? Math.round(Number(tx.amount) || 0) : 0;
    if (diff >= n) return 0;
    return installmentParts(tx)[diff];
  }

  /* ---- 정기 지출/수입 ---- */
  function subActiveIn(sub, ym) {
    if (sub.active === false) return false;
    var startYm = sub.startMonth ? String(sub.startMonth).slice(0, 7) : '0000-00';
    if (cmpYm(ym, startYm) < 0) return false;
    if (sub.endMonth && cmpYm(ym, String(sub.endMonth).slice(0, 7)) > 0) return false;
    return true;
  }
  function subDayIn(sub, y, m) {
    var dim = daysInMonth(y, m);
    if (sub.day === 'end' || sub.day === -1 || sub.day === 'last') return dim;
    return clampDay(y, m, Number(sub.day));
  }

  /* ---- 한 달(1일~말일) 항목 전개 ---- */
  function entriesForMonth(db, ym) {
    var p = ymParts(ym);
    var y = p.y, m = p.m, dim = daysInMonth(y, m);
    var out = [];

    (db.transactions || []).forEach(function (tx) {
      if (!tx || !tx.date) return;
      var amount = txAmountInMonth(tx, ym);
      if (!amount) return;
      var n = normMonths(tx);
      var d;
      if (n === 1 && ymOf(tx.date) === ym) {
        d = parts(tx.date).d;
      } else {
        d = clampDay(y, m, parts(tx.date).d);
      }
      out.push({
        date: ymd(y, m, d), type: tx.type || 'expense', amount: amount,
        catId: tx.catId || null, method: tx.method || 'account', cardId: tx.cardId || null,
        memo: tx.memo || '', kind: n > 1 ? 'installment' : 'tx',
        txId: tx.id, seq: n > 1 ? monthDiff(ymOf(tx.date), ym) + 1 : 0, months: n,
        totalAmount: Math.round(Number(tx.amount) || 0)
      });
    });

    (db.subscriptions || []).forEach(function (sub) {
      if (!sub || !subActiveIn(sub, ym)) return;
      var amt = Math.round(Number(sub.amount) || 0);
      if (!amt) return;
      out.push({
        date: ymd(y, m, subDayIn(sub, y, m)), type: sub.type || 'expense', amount: amt,
        catId: sub.catId || null, method: sub.method || 'account', cardId: sub.cardId || null,
        memo: sub.memo || '', kind: 'fixed', subId: sub.id, name: sub.name || '정기 지출',
        seq: 0, months: 1
      });
    });

    out.sort(function (a, b) {
      if (a.date !== b.date) return a.date < b.date ? -1 : 1;
      if (a.type !== b.type) return a.type === 'income' ? -1 : 1;
      return b.amount - a.amount;
    });
    return out;
  }

  function sum(list) { return list.reduce(function (s, e) { return s + e.amount; }, 0); }

  function monthSummary(db, ym) {
    var all = entriesForMonth(db, ym);
    var inc = all.filter(function (e) { return e.type === 'income'; });
    var exp = all.filter(function (e) { return e.type === 'expense'; });
    var byMethod = { account: 0, debit: 0, credit: 0 };
    var byCard = {};
    (db.cards || []).forEach(function (c) { byCard[c.id] = 0; });
    exp.forEach(function (e) {
      if (byMethod[e.method] === undefined) byMethod[e.method] = 0;
      byMethod[e.method] += e.amount;
      if (e.method === 'credit') {
        var k = e.cardId || '__none__';
        byCard[k] = (byCard[k] || 0) + e.amount;
      }
    });
    var income = sum(inc), expense = sum(exp);
    /* 통장(현금) 흐름: 계좌이체 + 체크카드만 통장에서 바로 나간 돈. 신용카드는 다음 달 대금으로 따로 나감 */
    var cashOut = byMethod.account + byMethod.debit;
    var cardOut = byMethod.credit;
    return {
      ym: ym, entries: all, incomeEntries: inc, expenseEntries: exp,
      income: income, expense: expense, net: income - expense,
      cashOut: cashOut, cardOut: cardOut, cashNet: income - cashOut,
      byMethod: byMethod, byCard: byCard
    };
  }

  /* ---- 전월 잔액 이월 ---- */
  function startYmOf(db) {
    var st = (db && db.settings) || {};
    if (isYm(st.startMonth)) return st.startMonth;
    var cands = [];
    (db.transactions || []).forEach(function (t) { if (t.date) cands.push(ymOf(t.date)); });
    (db.subscriptions || []).forEach(function (s) { if (s.startMonth) cands.push(String(s.startMonth).slice(0, 7)); });
    (db.budgets || []).forEach(function (b) { if (b.start) cands.push(ymOf(b.start)); });
    cands.sort();
    return cands.length ? cands[0] : '2000-01';
  }

  function carryInFor(db, ym) {
    var st = db.settings || {};
    var base = Math.round(Number(st.startBalance) || 0);
    if (st.carryOver === false) return 0;
    var sy = startYmOf(db);
    var diff = monthDiff(sy, ym);
    if (diff < 0) return 0;
    if (diff === 0) return base;
    var bal = base, cur = sy, guard = 0;
    while (cmpYm(cur, ym) < 0 && guard++ < 600) {
      var s = monthSummary(db, cur);
      bal += s.cashNet;   /* 통장 잔액 기준으로 이월 */
      cur = ymAdd(cur, 1);
    }
    return bal;
  }

  function monthFull(db, ym) {
    var s = monthSummary(db, ym);
    var carryIn = carryInFor(db, ym);
    s.carryIn = carryIn;
    s.balance = carryIn + s.cashNet;       /* 통장 잔액 */
    s.balanceAll = carryIn + s.net;        /* 참고: 카드 사용까지 포함한 잔액 */
    return s;
  }

  /* ---- 예산 기간 계산 ----
     basis: 'cash' = 통장 지출(계좌·체크·카드대금) / 'all' = 카드 사용까지 포함한 전체 소비 */
  function sumExpenseInRange(db, start, end, basis) {
    var cashOnly = basis === 'cash';
    var total = 0, cash = 0, card = 0, list = [], cur = ymOf(start), endYm = ymOf(end), guard = 0;
    while (cmpYm(cur, endYm) <= 0 && guard++ < 600) {
      entriesForMonth(db, cur).forEach(function (e) {
        if (e.type !== 'expense' || e.date < start || e.date > end) return;
        var isCard = e.method === 'credit';
        if (isCard) card += e.amount; else cash += e.amount;
        if (cashOnly && isCard) return;
        total += e.amount;
        list.push(e);
      });
      cur = ymAdd(cur, 1);
    }
    return { total: total, cashTotal: cash, cardTotal: card, entries: list };
  }

  function budgetStats(db, budget, today, basis) {
    var spentInfo = sumExpenseInRange(db, budget.start, budget.end, basis);
    var amount = Math.round(Number(budget.amount) || 0);
    var spent = spentInfo.total;
    var scheduled = spentInfo.entries.filter(function (e) { return e.date > today; })
      .reduce(function (s, e) { return s + e.amount; }, 0);
    var remaining = amount - spent;
    var daysLeft = 0, phase = 'current';
    if (today < budget.start) {
      phase = 'upcoming';
      daysLeft = dayDiff(budget.start, budget.end) + 1;
    } else if (today > budget.end) {
      phase = 'ended';
      daysLeft = 0;
    } else {
      daysLeft = dayDiff(today, budget.end) + 1;
    }
    var daily = daysLeft > 0 ? Math.floor(Math.max(0, remaining) / daysLeft) : 0;
    return {
      spent: spent, amount: amount, remaining: remaining,
      spentCash: spentInfo.cashTotal, spentCard: spentInfo.cardTotal,
      basis: basis === 'cash' ? 'cash' : 'all',
      scheduled: scheduled, spentActual: spent - scheduled,
      daysLeft: daysLeft, daily: daily, phase: phase,
      ratio: amount > 0 ? spent / amount : 0,
      totalDays: dayDiff(budget.start, budget.end) + 1,
      entries: spentInfo.entries
    };
  }

  function findBudgetAt(db, today) {
    var list = (db.budgets || []).filter(function (b) { return b.start && b.end; });
    var hit = list.filter(function (b) { return b.start <= today && today <= b.end; });
    if (hit.length) {
      hit.sort(function (a, b) { return a.start < b.start ? 1 : -1; });
      return hit[0];
    }
    return null;
  }

  return {
    pad2: pad2, ymd: ymd, ymOf: ymOf, ymParts: ymParts, daysInMonth: daysInMonth,
    clampDay: clampDay, ymAdd: ymAdd, monthDiff: monthDiff, cmpYm: cmpYm, dayDiff: dayDiff,
    todayStr: todayStr, normMonths: normMonths, installmentParts: installmentParts,
    txAmountInMonth: txAmountInMonth, subActiveIn: subActiveIn, subDayIn: subDayIn,
    entriesForMonth: entriesForMonth, monthSummary: monthSummary, carryInFor: carryInFor,
    monthFull: monthFull, sumExpenseInRange: sumExpenseInRange, budgetStats: budgetStats,
    findBudgetAt: findBudgetAt, startYmOf: startYmOf
  };
})();
if (typeof module !== 'undefined' && module.exports) module.exports = CORE;
/* ===== CORE:END ===== */

  /* ---------------- 이름/헬퍼 ---------------- */
  function cardById(id) { return (db.cards || []).filter(function (c) { return c.id === id; })[0]; }
  function catById(type, id) {
    var list = (db.categories && db.categories[type]) || [];
    return list.filter(function (c) { return c.id === id; })[0];
  }
  function catName(type, id) { var c = catById(type, id); return c ? c.name : '미분류'; }
  function catEmoji(type, id) { var c = catById(type, id); return c ? (c.emoji || '•') : '•'; }
  function methodName(m) { return m === 'credit' ? '신용카드' : m === 'debit' ? '체크카드' : '계좌이체'; }
  function methodLabel(e) {
    if (e.method === 'credit') { var c = cardById(e.cardId); return '신용카드 · ' + (c ? c.name : '카드'); }
    return methodName(e.method);
  }
  function monthTitle(ym) { var p = CORE.ymParts(ym); return p.y + '년 ' + p.m + '월'; }

  /* ---------------- 렌더 ---------------- */
  function render() {
    var scr = document.getElementById('scr');
    if (st.route === 'calendar') scr.innerHTML = viewCalendar();
    else if (st.route === 'list') scr.innerHTML = viewList();
    else if (st.route === 'budget') scr.innerHTML = viewBudget();
    else scr.innerHTML = viewSettings();
    Array.prototype.forEach.call(document.querySelectorAll('#tabs button[data-tab]'), function (b) {
      b.classList.toggle('on', b.getAttribute('data-tab') === st.route);
    });
    scr.scrollTop = st._scroll || 0;
  }

  function headMonth() {
    return '' +
      '<div class="vhead">' +
      '  <div class="mnav">' +
      '    <button onclick="App.step(-1)" aria-label="이전 달">‹</button>' +
      '    <div class="ym">' + monthTitle(st.ym) + '</div>' +
      '    <button onclick="App.step(1)" aria-label="다음 달">›</button>' +
      '  </div>' +
      '  <button class="ghost" onclick="App.today()">오늘</button>' +
      '</div>';
  }

  /* ① 달력 ================================================= */
  function viewCalendar() {
    var s = CORE.monthFull(db, st.ym);
    var cardRows = (db.cards || []).map(function (c) {
      return { c: c, v: s.byCard[c.id] || 0 };
    });
    var cardTotal = cardRows.reduce(function (a, r) { return a + r.v; }, 0);
    var others = (s.byCard['__none__'] || 0);
    var maxCard = Math.max.apply(null, cardRows.map(function (r) { return r.v; }).concat([1]));

    var html = headMonth();
    html += '<div class="wrap">';

    /* 통장 잔액 카드 (현금 흐름 기준) */
    html += '<div class="bal">' +
      '<div class="t">' + (Number(st.ym.slice(5)) ) + '월 통장 잔액' + (db.settings.carryOver ? ' (이월 포함)' : '') + '</div>' +
      '<div class="v">' + fmt(s.balance) + '<small>원</small></div>' +
      '<div class="r">' +
      '  <div><span>수입</span><b>' + fmt(s.income) + '</b></div>' +
      '  <div><span>통장 지출</span><b>' + fmt(s.cashOut) + '</b></div>' +
      '  <div><span>전월 이월</span><b>' + fmt(s.carryIn) + '</b></div>' +
      '</div>' +
      '</div>';

    /* 신용카드 사용액 (1일~말일) */
    html += '<div class="sect-h"><b>신용카드 사용액</b><span class="l">' +
      Number(st.ym.slice(5)) + '/1 ~ ' + Number(st.ym.slice(5)) + '/' + CORE.daysInMonth(Number(st.ym.slice(0, 4)), Number(st.ym.slice(5))) +
      ' 합계 ' + won(cardTotal) + '</span></div>';
    html += '<div class="cardstrip">';
    if (!cardRows.length) {
      html += '<div class="ctile empty" onclick="App.goto(\'settings\')">설정에서 신용카드를<br>추가해 보세요</div>';
    } else {
      cardRows.forEach(function (r) {
        var pct = Math.round((r.v / maxCard) * 100);
        html += '<div class="ctile"><div class="ct-top"><i style="background:' + r.c.color + '"></i>' + esc(r.c.name) + '</div>' +
          '<div class="ct-amt">' + fmt(r.v) + '<span style="font-size:10.5px;font-weight:700;color:#8B929C">원</span></div>' +
          '<div class="ct-bar"><i style="width:' + pct + '%;background:' + r.c.color + '"></i></div></div>';
      });
    }
    html += '</div>';

    /* 달력 */
    html += '<div class="cal">' + calGrid(s) + '</div>';

    /* 예산 미니 */
    var bud = CORE.findBudgetAt(db, today()) || (db.budgets || [])[0];
    if (bud) {
      var bs = CORE.budgetStats(db, bud, today(), db.settings.budgetBasis === 'all' ? 'all' : 'cash');
      var barCls = bs.ratio >= 1 ? 'over' : bs.ratio >= 0.8 ? 'warn' : '';
      var pct = Math.min(100, Math.round(bs.ratio * 100));
      html += '<div class="sect-h"><b>예산</b><span class="l">' + esc(bud.label || '예산') + '</span></div>';
      html += '<div class="bmini" onclick="App.goto(\'budget\')">' +
        '<div class="top"><span class="nm">' + esc(bud.label || '예산') + '</span><span class="pr">' + shortDate(bud.start) + ' ~ ' + shortDate(bud.end) + '</span></div>' +
        '<div class="bar"><i class="' + barCls + '" style="width:' + pct + '%"></i></div>' +
        '<div class="bot"><span><span class="k">남은</span>' + won(bs.remaining) + '</span>' +
        '<span><span class="k">하루</span>' + won(bs.daily) + '</span></div></div>';
    }

    html += '</div>';
    return html;
  }

  function shortDate(s) { var p = s.split('-'); return Number(p[1]) + '/' + Number(p[2]); }
  function dateLabel(s) {
    if (!/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
    var p = s.split('-').map(Number);
    var dow = ['일', '월', '화', '수', '목', '금', '토'][new Date(p[0], p[1] - 1, p[2]).getDay()];
    return p[0] + '년 ' + p[1] + '월 ' + p[2] + '일 (' + dow + ')';
  }
  function addDays(s, n) {
    var p = s.split('-').map(Number);
    var d = new Date(p[0], p[1] - 1, p[2] + n);
    return CORE.ymd(d.getFullYear(), d.getMonth() + 1, d.getDate());
  }

  function calGrid(s) {
    var p = CORE.ymParts(st.ym), y = p.y, m = p.m;
    var dim = CORE.daysInMonth(y, m);
    var first = new Date(y, m - 1, 1).getDay();
    var prevDim = CORE.daysInMonth(y, m - 1 === 0 ? 12 : m - 1);
    var byDay = {};
    s.entries.forEach(function (e) {
      var d = Number(e.date.slice(8));
      if (!byDay[d]) byDay[d] = { cash: 0, card: 0, i: 0, fx: false };
      if (e.type === 'income') byDay[d].i += e.amount;
      else if (e.method === 'credit') byDay[d].card += e.amount;
      else byDay[d].cash += e.amount;
      if (e.kind === 'fixed') byDay[d].fx = true;
    });

    var h = '<div class="calleg"><span><i class="i"></i>수입</span><span><i class="c"></i>통장</span><span><i class="v"></i>카드</span></div>' +
      '<div class="wd"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div><div class="grid">';
    var cells = [];
    for (var i = 0; i < first; i++) {
      var pd = prevDim - first + 1 + i;
      cells.push({ out: true, d: pd, dow: i });
    }
    for (var d = 1; d <= dim; d++) {
      cells.push({ out: false, d: d, dow: (first + d - 1) % 7 });
    }
    while (cells.length % 7 !== 0) {
      cells.push({ out: true, d: cells.length - (first + dim) + 1, dow: (cells.length) % 7 });
    }
    var t = today();
    cells.forEach(function (c) {
      var cls = ['cell'];
      if (c.dow === 0) cls.push('sun');
      if (c.dow === 6) cls.push('sat');
      if (c.out) cls.push('out');
      var isToday = !c.out && t === st.ym + '-' + CORE.pad2(c.d);
      if (isToday) cls.push('today');
      if (!c.out && st.selDay === st.ym + '-' + CORE.pad2(c.d)) cls.push('sel');
      var info = !c.out ? byDay[c.d] : null;
      h += '<button class="' + cls.join(' ') + '" onclick="App.tapDay(' + (c.out ? 0 : c.d) + ')">' +
        '<i class="dn">' + c.d + '</i>';
      if (info) {
        var rows = [];
        if (info.i) rows.push(['i', '+' + fmt(info.i)]);
        if (info.cash) rows.push(['c', fmt(info.cash)]);
        if (info.card) rows.push(['v', fmt(info.card)]);
        rows.forEach(function (r) {
          var long = r[1].length >= 10 ? ' long' : '';
          h += '<i class="am ' + r[0] + long + '">' + r[1] + '</i>';
        });
        if (!rows.length && info.fx) h += '<i class="am">·</i>';
      }
      h += '</button>';
    });
    h += '</div>';
    return h;
  }

  /* ② 내역 ================================================= */
  function viewList() {
    var s = CORE.monthFull(db, st.ym);
    var list = s.entries.filter(function (e) {
      if (st.listFilter === 'all') return true;
      if (st.listFilter === 'expense' || st.listFilter === 'income') return e.type === st.listFilter;
      if (st.listFilter === 'credit') return e.method === 'credit';
      if (st.listFilter === 'fixed') return e.kind === 'fixed';
      return true;
    });
    var groups = {};
    list.forEach(function (e) { (groups[e.date] = groups[e.date] || []).push(e); });
    var dates = Object.keys(groups).sort().reverse();

    var h = headMonth();
    h += '<div class="wrap">';
    h += '<div class="card" style="display:flex;justify-content:space-around;padding:12px 8px;margin-top:2px">' +
      '<div style="text-align:center"><div class="muted">수입</div><div class="inc" style="font-size:14px;font-weight:800;letter-spacing:-.4px">' + fmt(s.income) + '</div></div>' +
      '<div style="width:1px;background:#F0F2F5"></div>' +
      '<div style="text-align:center"><div class="muted">통장 지출</div><div class="ex" style="font-size:14px;font-weight:800;letter-spacing:-.4px">' + fmt(s.cashOut) + '</div></div>' +
      '<div style="width:1px;background:#F0F2F5"></div>' +
      '<div style="text-align:center"><div class="muted">카드 사용</div><div style="font-size:14px;font-weight:800;letter-spacing:-.4px;color:var(--violet)">' + fmt(s.cardOut) + '</div></div>' +
      '<div style="width:1px;background:#F0F2F5"></div>' +
      '<div style="text-align:center"><div class="muted">통장 잔액</div><div style="font-size:14px;font-weight:800;letter-spacing:-.4px">' + fmt(s.balance) + '</div></div>' +
      '</div>';

    h += '<div class="chips" style="padding-left:0;padding-right:0">' +
      chip('all', '전체') + chip('expense', '지출') + chip('income', '수입') + chip('credit', '카드') + chip('fixed', '정기') +
      '</div>';

    if (!dates.length) {
      h += '<div class="empty">이 달 기록이 아직 없어요</div>';
    }
    dates.forEach(function (dt) {
      var items = groups[dt];
      var dayExp = items.filter(function (e) { return e.type === 'expense'; }).reduce(function (a, e) { return a + e.amount; }, 0);
      var dayInc = items.filter(function (e) { return e.type === 'income'; }).reduce(function (a, e) { return a + e.amount; }, 0);
      var dow = ['일', '월', '화', '수', '목', '금', '토'][new Date(Date.parse(dt + 'T00:00:00')).getDay()];
      h += '<div class="daygroup"><div class="dh"><span><b>' + Number(dt.slice(5, 7)) + '월 ' + Number(dt.slice(8)) + '일</b>' + dow + '</span><span>' +
        (dayInc ? '<span class="inc">+' + fmt(dayInc) + '</span> ' : '') +
        (dayExp ? '<span class="ex">-' + fmt(dayExp) + '</span>' : '') + '</span></div>';
      h += '<div class="items">';
      items.forEach(function (e) {
        var nm = e.kind === 'fixed' ? (e.name || '정기') : catName(e.type, e.catId);
        var tag = '';
        if (e.kind === 'installment') tag = '<span class="tag inst">' + e.seq + '/' + e.months + '회차</span>';
        if (e.kind === 'fixed') tag = '<span class="tag fix">정기</span>';
        var meta = methodLabel(e) + (e.memo ? ' · ' + esc(e.memo) : '');
        if (e.kind === 'installment') meta = methodLabel(e) + ' · 총 ' + won(e.totalAmount) + (e.memo ? ' · ' + esc(e.memo) : '');
        h += '<button class="item" onclick="App.openEntry(\'' + e.kind + '\',\'' + (e.txId || e.subId || '') + '\')">' +
          '<span class="ic">' + catEmoji(e.type, e.catId) + '</span>' +
          '<span class="mid"><span class="nm">' + esc(nm) + tag + '</span>' +
          '<span class="meta">' + meta + '</span></span>' +
          '<span class="amt ' + (e.type === 'income' ? 'inc' : '') + '">' + (e.type === 'income' ? '+' : '-') + fmt(e.amount) + '</span></button>';
      });
      h += '</div></div>';
    });
    h += '<div style="height:10px"></div></div>';
    return h;
  }
  function chip(k, label) {
    return '<button class="chip ' + (st.listFilter === k ? 'on' : '') + '" onclick="App.setFilter(\'' + k + '\')">' + label + '</button>';
  }

  /* ③ 예산 ================================================= */
  function viewBudget() {

    var cur = st.budgetId ? list.filter(function (b) { return b.id === st.budgetId; })[0] : null;

    var bs = CORE.budgetStats(db, cur, today(), basis);
    var pct = Math.min(100, Math.round(bs.ratio * 100));
    var barCls = bs.ratio >= 1 ? 'over' : bs.ratio >= 0.8 ? 'warn' : '';
    var phaseTxt = bs.phase === 'upcoming' ? '아직 시작 전' : bs.phase === 'ended' ? '기간 종료' : '진행 중';

    h += '<div class="seg" style="margin:2px 0 10px">' +

      '<div class="sub2">총 예산 ' + won(bs.amount) + ' · ' + basisName + ' 지출 ' + won(bs.spent) +
      (bs.scheduled ? ' <span style="color:#8B929C">(예정 ' + won(bs.scheduled) + ' 포함)</span>' : '') + '</div>' +
      '<div class="grid2">' +
      '<div class="kbox"><div class="k">통장 지출 (계좌·체크·카드대금)</div><div class="v" style="font-size:13px">' + won(bs.spentCash) + '</div></div>' +
      '<div class="kbox"><div class="k">신용카드 사용액 (다음 달 대금)</div><div class="v" style="font-size:13px;color:var(--violet)">' + won(bs.spentCard) + '</div></div>' +
      '</div>' +

      .sort(function (a, b) { return b.v - a.v; }).slice(0, 5);
    if (catRows.length) {
      h += '<div class="sect-h"><b>이 기간 지출 Top</b><span class="l">' + basisName + ' · ' + won(bs.spent) + '</span></div><div class="card">';

          '<div class="bar" style="height:5px;margin:5px 0 0"><i style="width:' + p + '%"></i></div></div>';

    h += '<div class="sect-h"><b>전체 예산 기간</b><span class="l">' + list.length + '개</span></div>';

        '<button class="act d" onclick="App.deleteBudget(\'' + b.id + '\')">삭제</button></div>';

    return h;

  /* ---------------- 입력 시트 ---------------- */
  function openInput(prefill) {
    var t = today();
    st.input = {
      type: (prefill && prefill.type) || 'expense',
      amount: '',
      date: (prefill && prefill.date) || t,
      catId: null,
      method: 'credit',
      cardId: (db.cards[0] || {}).id || null,
      memo: '',
      months: 1,
      editId: null
    };
    if (prefill && prefill.tx) {
      var tx = prefill.tx;
      st.input = {
        type: tx.type, amount: String(tx.amount), date: tx.date, catId: tx.catId,
        method: tx.method, cardId: tx.cardId, memo: tx.memo || '',
        months: tx.installment && tx.installment.months ? tx.installment.months : 1,
        editId: tx.id
      };
    }
    if (!st.input.catId) {
      var list = db.categories[st.input.type] || [];
      st.input.catId = list.length ? list[0].id : null;
    }
    renderInput();
  }

  function deleteCatInternal(type, id) {
    var list = db.categories[type] || [];
    if (list.length <= 1) { toast('항목이 하나는 있어야 해요'); return false; }
    var target = list.filter(function (c) { return c.id === id; })[0];
    if (!target) return false;
    var used = (db.transactions || []).some(function (t) { return t.type === type && t.catId === id; }) ||
      (db.subscriptions || []).some(function (s) { return s.type === type && s.catId === id; });
    var other = list.filter(function (c) { return c.id !== id; })[0];
    if (used) {
      if (!confirm('이 항목을 쓴 기록이 있어요. 그 기록들을 ‘' + other.name + '’으로 옮기고 삭제할까요?')) return false;
      db.transactions.forEach(function (t) { if (t.type === type && t.catId === id) t.catId = other.id; });
      (db.subscriptions || []).forEach(function (s) { if (s.type === type && s.catId === id) s.catId = other.id; });
    } else {
      if (!confirm('이 항목을 삭제할까요?')) return false;
    }
    db.categories[type] = list.filter(function (c) { return c.id !== id; });
    save();
    return true;
  }

  /* ---------------- 모달 ---------------- */
  function showModal(html, isDialog) {
    var m = document.getElementById('modal');
    m.innerHTML = '<div class="bg" onclick="App.closeModal()"></div>' + html;
    m.classList.remove('hidden');
  }
  function closeModal() {
    var m = document.getElementById('modal');
    m.classList.add('hidden');
    m.innerHTML = '';
    st.sheet = null;
    if (location.hash === '#input') history.replaceState(null, '', '#' + st.route);
  }

  function toast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('on');
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { t.classList.remove('on'); }, 1700);
  }

  /* ---------------- 액션 ---------------- */
  var api = {
    goto: function (route) {
      st._scroll = 0;
      st.route = route;
      if (route !== 'budget') st.budgetId = null;
      var m = document.getElementById('modal');
      if (m && !m.classList.contains('hidden')) { m.classList.add('hidden'); m.innerHTML = ''; st.sheet = null; }
      render();
      if (location.hash !== '#' + route) history.replaceState(null, '', '#' + route);
      document.getElementById('scr').scrollTop = 0;
    },
    step: function (n) {
      st.ym = CORE.ymAdd(st.ym, n);
      st._scroll = 0;
      render();
      document.getElementById('scr').scrollTop = 0;
    },
    today: function () {
      st.ym = CORE.ymOf(today());
      st._scroll = 0;
      render();
      document.getElementById('scr').scrollTop = 0;
    },
    setFilter: function (k) { st.listFilter = k; render(); },
    tapDay: function (d) {
      if (!d) return;
      var date = st.ym + '-' + CORE.pad2(d);
      st.selDay = st.selDay === date ? '' : date;
      var s = CORE.monthFull(db, st.ym);
      var items = s.entries.filter(function (e) { return e.date === date; });
      var h = '<div class="sheet" style="max-height:80dvh"><div class="sh-head">' +
        '<div class="ttl">' + Number(date.slice(5, 7)) + '월 ' + Number(date.slice(8)) + '일</div>' +
        '<button class="xbtn" onclick="App.closeModal()">✕</button></div><div class="sh-body">';
      if (!items.length) {
        h += '<div class="empty" style="padding:20px">기록이 없어요</div>';
      } else {
        h += '<div class="items">';
        items.forEach(function (e) {
          h += '<button class="item" onclick="App.openEntry(\'' + e.kind + '\',\'' + (e.txId || e.subId || '') + '\')">' +
            '<span class="ic">' + catEmoji(e.type, e.catId) + '</span>' +
            '<span class="mid"><span class="nm">' + esc(e.kind === 'fixed' ? e.name : catName(e.type, e.catId)) +
            (e.kind === 'installment' ? '<span class="tag inst">' + e.seq + '/' + e.months + '회차</span>' : '') + '</span>' +
            '<span class="meta">' + methodLabel(e) + (e.memo ? ' · ' + esc(e.memo) : '') + '</span></span>' +
            '<span class="amt ' + (e.type === 'income' ? 'inc' : '') + '">' + fmt(e.amount) + '</span></button>';
        });
        h += '</div>';
      }
      h += '</div><div class="sh-foot"><button class="btn" onclick="App.openInput({date:\'' + date + '\'})">이 날 기록 추가</button></div></div>';
      showModal(h);
    },
    pickBudget: function (id) { st.budgetId = id; render(); },
    setBudgetBasis: function (b) {
      db.settings.budgetBasis = b === 'all' ? 'all' : 'cash';
      save(); render();
    },
    toggleBudgetBasis: function () {
      db.settings.budgetBasis = db.settings.budgetBasis === 'all' ? 'cash' : 'all';
      save(); render();
      toast(db.settings.budgetBasis === 'all' ? '예산을 전체 소비(카드 포함) 기준으로 볼게요' : '예산을 통장 지출 기준으로 볼게요');
    },

    /* 입력 */
    openInput: openInput,
    setInputType: function (t) {
      syncInput();
      st.input.type = t;
      var list = db.categories[t] || [];
      if (!catById(t, st.input.catId)) st.input.catId = list.length ? list[0].id : null;

    saveSub: function (id) {
      var name = document.getElementById('sub-name').value.trim();
      var amount = num(document.getElementById('sub-amount').value);
      var isLast = document.getElementById('sub-last').checked;
      var day = isLast ? 'end' : Number(document.getElementById('sub-day').value) || 1;
      var method = document.getElementById('sub-method').value;
      var cardId = document.getElementById('sub-card').value || null;
      var startMonth = document.getElementById('sub-start').value || CORE.ymOf(today());
      var endMonth = document.getElementById('sub-end').value || null;
      if (!name) { toast('이름을 입력해 주세요'); return; }
      if (!amount) { toast('금액을 입력해 주세요'); return; }
      if (day !== 'end' && (day < 1 || day > 31)) { toast('날짜는 1~31일 사이로'); return; }
      if (method === 'credit' && !cardId) { toast('카드를 선택해 주세요'); return; }
      var s = {
        id: id || nid('s'), name: name, amount: amount,
        type: document.getElementById('sub-type').value,
        catId: id ? ((db.subscriptions.filter(function (x) { return x.id === id; })[0] || {}).catId || null) : null,
        method: method, cardId: method === 'credit' ? cardId : null,
        day: day, startMonth: startMonth, endMonth: endMonth,
        active: id ? ((db.subscriptions.filter(function (x) { return x.id === id; })[0] || {}).active !== false) : true
      };
      if (!s.catId) {
        var list = db.categories[s.type === 'income' ? 'income' : 'expense'];
        s.catId = list[0].id;
      }
      var idx = -1;
      db.subscriptions.forEach(function (x, i) { if (x.id === s.id) idx = i; });
      if (idx >= 0) db.subscriptions[idx] = s; else db.subscriptions.push(s);

      save(); closeModal(); render(); toast('삭제했어요');

      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'budget-backup-' + today() + '.json';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
      toast('백업 파일을 내려받았어요');
    },
    importJSON: function (input) {
      var f = input.files && input.files[0];
      if (!f) return;
      var r = new FileReader();
      r.onload = function () {
        try {
          var d = JSON.parse(r.result);
          if (!d || !d.transactions) throw new Error('invalid');
          db = normalize(d);
          save(); render(); toast('백업을 불러왔어요');
        } catch (e) { toast('이 파일은 읽을 수 없어요'); }
      };
      r.readAsText(f);
    },
    reseed: function () {
      if (!confirm('지금 기록을 모두 지우고 데모 데이터로 채울까요?')) return;
      db = seed(); save(); render(); toast('데모 데이터를 채웠어요');
    },
    clearAll: function () {
      if (!confirm('모든 기록을 지우고 빈 가계부로 시작할까요?')) return;
      reset();
    },
    closeModal: closeModal,
    toast: toast
  };

  function syncInput() {
    var el = document.getElementById('f-amount');
    if (!el) return;
    st.input.amount = el.value;
    var d = document.getElementById('f-date');
    if (d) st.input.date = d.value || st.input.date;
    var mm = document.getElementById('f-memo');
    if (mm) st.input.memo = mm.value;
    var ins = document.getElementById('f-inst');
    if (ins) st.input.months = Number(ins.value) || 1;
  }

  /* ---------------- 시작 ---------------- */
  var booted = false;
  function boot() {
    if (booted) return;
    booted = true;
    db = load();
    st.ym = CORE.ymOf(today());
    var hash = (location.hash || '').replace('#', '');
    if (['calendar', 'list', 'budget', 'settings'].indexOf(hash) >= 0) st.route = hash;
    render();
    if (hash === 'input') { api.goto('calendar'); openInput(); }
    /* 첫 방문이면 안내 */
    if (!localStorage.getItem(LS + '-seen')) {
      localStorage.setItem(LS + '-seen', '1');
      setTimeout(function () { toast('데모 데이터로 시작했어요 · 설정에서 비울 수 있어요'); }, 500);
    }
  }

  api.boot = boot;
  api._db = function () { return db; };
  api._state = st;

  window.addEventListener('hashchange', function () {
    var h = (location.hash || '').replace('#', '');
    if (h === 'input') { if (!st.input) openInput(); return; }
    if (['calendar', 'list', 'budget', 'settings'].indexOf(h) >= 0) {
      if (h !== st.route) { st.route = h; st._scroll = 0; }
      var mm = document.getElementById('modal');
      if (mm && !mm.classList.contains('hidden')) { mm.classList.add('hidden'); mm.innerHTML = ''; st.sheet = null; }
      render();
    }
  });
  return api;
})();

document.addEventListener('DOMContentLoaded', function () {
  App.boot();
});
if (document.readyState === 'complete' || document.readyState === 'interactive') { try { App.boot(); } catch (e) { } }
</script>
</body>
</html>
